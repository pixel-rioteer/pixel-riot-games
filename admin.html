<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | PIXEL-RIOT</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body class="min-h-screen bg-black text-white font-sans"><nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10"><div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"><a href="home/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a><div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div></div></nav><main class="max-w-6xl mx-auto px-6 py-16" id="admin-main"><p class="text-gray-400">Checking access...</p></main><script type="module">
import{requireAuth,getProfile,blockIfBanned,fetchGames,createGame,updateGame,deleteGame,escapeHtml,fetchGameRequests,deleteGameRequest,fetchReports,updateReportStatus,banUser,rankBadge,saveGamePage}from"/assets/pixel-riot-app.js";
const session=await requireAuth();if(session&&!(await blockIfBanned())){const profile=await getProfile(),main=document.getElementById("admin-main");if(!profile?.is_admin)main.innerHTML='<p class="text-gray-400">You need admin access to view this page.</p>';else{main.innerHTML=`<p class="text-cyan-400 uppercase tracking-[0.3em] text-sm font-bold">Admin</p><h1 class="text-5xl font-black mt-4">Manage Games</h1><section class="mt-10 rounded-3xl border border-white/10 bg-zinc-950 p-8"><h2 class="text-2xl font-bold mb-2">Reports &amp; Moderation</h2><div id="reports-list" class="space-y-4"><p class="text-gray-400 text-sm">Loading...</p></div></section><section class="mt-10 rounded-3xl border border-white/10 bg-zinc-950 p-8"><h2 class="text-2xl font-bold mb-2">Game Requests</h2><p class="text-gray-400 text-sm mb-6">Dismiss permanently deletes the request.</p><div id="requests-list" class="space-y-4"></div></section><section class="mt-10 rounded-3xl border border-white/10 bg-zinc-950 p-8"><h2 class="text-2xl font-bold mb-6">Add a Game</h2><form id="add-form" class="grid grid-cols-1 md:grid-cols-2 gap-4"><input name="title" placeholder="Title" required class="field"><input name="slug" placeholder="slug-like-this" required class="field"><input name="category" placeholder="Category" class="field"><input name="platform" placeholder="Platform(s)" class="field"><input name="price" placeholder="Price" class="field"><input name="price_breakdown" placeholder="Per-platform breakdown" class="field"><input name="image_url" placeholder="Image URL" class="field"><input name="tagline" placeholder="Tagline" class="field md:col-span-2"><textarea name="description" placeholder="Description" rows="3" class="field md:col-span-2"></textarea><button class="md:col-span-2 py-4 rounded-2xl bg-cyan-500 text-black font-black">Add Game</button><p id="add-message" class="md:col-span-2 text-sm text-gray-400"></p></form></section><section class="mt-12"><div class="flex items-end justify-between gap-4 mb-6"><div><h2 class="text-2xl font-bold">Existing Games</h2><p class="text-gray-500 text-sm mt-1">Edit content or open the visual page builder.</p></div></div><div id="games-admin-list" class="space-y-5"></div></section>`;
const presets={neon:{accent:'#22d3ee',background:'#050505',surface:'#0a0a0a',text:'#f4f4f5'},purple:{accent:'#a855f7',background:'#08050d',surface:'#120b1d',text:'#faf5ff'},fire:{accent:'#fb923c',background:'#0b0502',surface:'#1a0c05',text:'#fff7ed'},ice:{accent:'#60a5fa',background:'#031018',surface:'#071a25',text:'#eff6ff'},lime:{accent:'#a3e635',background:'#071007',surface:'#0d1a0d',text:'#f7fee7'}};
const labels={hero:'Hero',image:'Cover Image',description:'Description',info:'Game Info',price:'Price',tips:'Tips',known_issues:'Known Issues',secrets_cheats:'Secrets & Cheats',commands_reference:'Commands Reference',elements_reference:'Elements Reference',reviews:'Player Reviews'};
function esc(v){return escapeHtml(v)}
function preview(g,theme,layout){const t=theme||presets.neon;return `<div class="rounded-3xl overflow-hidden border p-6 space-y-4" style="background:${t.background};color:${t.text};border-color:${t.accent}55"><div class="text-xs uppercase tracking-widest" style="color:${t.accent}">${esc(g.category||'GAME')}</div>${layout.filter(x=>x.visible!==false).map(x=>x.type==='hero'?`<div><div class="text-4xl font-black">${esc(g.title)}</div><div class="opacity-70 mt-2">${esc(g.tagline||'')}</div></div>`:x.type==='image'?`<div class="h-40 rounded-2xl bg-cover bg-center" style="background-image:url('${esc(g.image_url||'')}')"></div>`:x.type==='description'?`<p class="opacity-80 leading-relaxed">${esc(g.description||'Description goes here.')}</p>`:x.type==='info'?`<div class="flex gap-2 flex-wrap"><span class="px-3 py-2 rounded-xl" style="background:${t.surface}">${esc(g.platform||'Platform')}</span><span class="px-3 py-2 rounded-xl" style="background:${t.surface}">${esc(g.category||'Category')}</span></div>`:x.type==='price'?`<div class="font-black" style="color:${t.accent}">${esc(g.price||'Price')}</div>`:x.type==='tips'?`<section><h3 class="font-bold">Tips</h3><p class="opacity-70">${esc(g.tips||'Add tips in the game editor.')}</p></section>`:x.type==='known_issues'?`<section><h3 class="font-bold">Known Issues</h3><p class="opacity-70">${esc(g.known_issues||'Add known issues in the game editor.')}</p></section>`:x.type==='secrets_cheats'?`<section><h3 class="font-bold">Secrets & Cheats</h3><p class="opacity-70">${esc(g.secrets_cheats||'Add secrets and cheats in the game editor.')}</p></section>`:x.type==='commands_reference'?`<section><h3 class="font-bold">Commands Reference</h3><p class="opacity-70">${esc(g.commands_reference||'Add commands in the game editor.')}</p></section>`:x.type==='elements_reference'?`<section><h3 class="font-bold">Elements Reference</h3><p class="opacity-70">${esc(g.elements_reference||'Add elements in the game editor.')}</p></section>`:x.type==='reviews'?`<section><h3 class="font-bold">Player Reviews</h3><p class="opacity-70">Reviews appear here.</p></section>`:'' ).join('')}</div>`}
function builder(g,article){const slot=article.querySelector('[data-builder]');if(slot.innerHTML){slot.innerHTML='';return}let theme=g.page_theme||presets.neon,layout=Array.isArray(g.page_layout)&&g.page_layout.length?g.page_layout:[...Object.keys(labels).map((type,i)=>({id:type,type,visible:true}))];slot.innerHTML=`<div class="mt-5 border-t border-white/10 pt-5"><div class="grid lg:grid-cols-2 gap-6"><div><div class="flex flex-wrap gap-2 mb-4"><span class="text-sm font-bold mr-2">Theme</span>${Object.keys(presets).map(p=>`<button data-preset="${p}" class="px-3 py-2 rounded-xl border border-white/10 text-sm">${p}</button>`).join('')}</div><div class="grid grid-cols-2 gap-3 mb-5">${[['title','Title'],['category','Category'],['tagline','Tagline'],['image_url','Image URL'],['platform','Platform'],['price','Price'],['price_breakdown','Price breakdown'],['description','Description'],['tips','Tips'],['known_issues','Known Issues'],['secrets_cheats','Secrets & Cheats'],['commands_reference','Commands Reference'],['elements_reference','Elements Reference']].map(([f,l])=>f==='description'||f.includes('tips')||f.includes('issues')||f.includes('cheats')||f.includes('commands')||f.includes('elements')?`<textarea data-field="${f}" placeholder="${l}" rows="2" class="field col-span-2">${esc(g[f]||'')}</textarea>`:`<input data-field="${f}" placeholder="${l}" value="${esc(g[f]||'')}" class="field">`).join('')}</div><div class="flex gap-3"><button data-save class="flex-1 py-3 rounded-xl bg-cyan-500 text-black font-black">Save Page</button><button data-close class="px-5 py-3 rounded-xl border border-white/10">Close</button></div></div><div><div class="flex items-center justify-between mb-3"><h3 class="font-bold">Drag page sections</h3><span class="text-xs text-gray-500">drag to reorder • click eye to hide</span></div><div data-layout class="space-y-2">${layout.map((x,i)=>`<div draggable="true" data-index="${i}" class="flex items-center gap-3 p-3 rounded-xl bg-white/5 border border-white/10 cursor-grab"><span class="text-gray-500">☷</span><span class="flex-1">${labels[x.type]||x.type}</span><button data-toggle="${i}" class="text-sm ${x.visible===false?'text-red-400':'text-cyan-400'}">${x.visible===false?'○':'●'}</button></div>`).join('')}</div><div id="page-preview" class="mt-5">${preview(g,theme,layout)}</div></div></div></div>`;
function refresh(){slot.querySelector('#page-preview').innerHTML=preview(g,theme,layout)}
slot.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{theme={...presets[b.dataset.preset],preset:b.dataset.preset};refresh()});slot.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{g[el.dataset.field]=el.value;refresh()});slot.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{layout[+b.dataset.toggle].visible=layout[+b.dataset.toggle].visible===false?true:false;b.textContent=layout[+b.dataset.toggle].visible?'●':'○';b.className='text-sm '+(layout[+b.dataset.toggle].visible?'text-cyan-400':'text-red-400');refresh()});let drag=null;slot.querySelectorAll('[data-index]').forEach(el=>{el.ondragstart=()=>drag=+el.dataset.index;el.ondragover=e=>e.preventDefault();el.ondrop=()=>{const to=+el.dataset.index;if(drag===to)return;const item=layout.splice(drag,1)[0];layout.splice(to,0,item);builder(g,article);builder(g,article)} });slot.querySelector('[data-save]').onclick=async()=>{const{error}=await saveGamePage(g.id,theme,layout);if(error)alert(error.message);else{Object.assign(g,{page_theme:theme,page_layout:layout});slot.innerHTML='<p class="text-cyan-400 text-sm">Page saved.</p>';setTimeout(()=>{slot.innerHTML=''},700)}};slot.querySelector('[data-close]').onclick=()=>slot.innerHTML='';}
async function renderList(){const games=await fetchGames(),c=document.getElementById('games-admin-list');c.innerHTML=games.map(g=>`<article class="rounded-2xl border border-white/10 bg-white/5 p-5" data-game-id="${g.id}"><div class="flex items-center justify-between gap-4"><div><h3 class="text-xl font-bold">${esc(g.title)}</h3><p class="text-gray-400 text-sm">${esc(g.slug)} · ${esc(g.category||'')}</p></div><div class="flex gap-3"><button data-builder-open class="text-cyan-400 text-sm font-semibold">Page Builder</button><button data-edit class="text-purple-300 text-sm font-semibold">Edit</button><button data-delete class="text-red-400 text-sm font-semibold">Delete</button></div></div><div data-builder></div><div data-edit-slot></div></article>`).join('');c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const a=b.closest('[data-game-id]');if(confirm('Delete this game?')){const r=await deleteGame(a.dataset.gameId);if(!r.error)a.remove();}});c.querySelectorAll('[data-builder-open]').forEach(b=>b.onclick=()=>builder(games.find(g=>g.id===b.closest('[data-game-id]').dataset.gameId),b.closest('[data-game-id]')));c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const a=b.closest('[data-game-id]'),g=games.find(x=>x.id===a.dataset.gameId),s=a.querySelector('[data-edit-slot]');s.innerHTML=`<form class="mt-4 grid grid-cols-2 gap-3"><input name="title" value="${esc(g.title)}" class="field"><input name="category" value="${esc(g.category||'')}" class="field"><input name="platform" value="${esc(g.platform||'')}" class="field"><input name="price" value="${esc(g.price||'')}" class="field"><input name="tagline" value="${esc(g.tagline||'')}" class="field col-span-2"><textarea name="description" class="field col-span-2">${esc(g.description||'')}</textarea><input name="image_url" value="${esc(g.image_url||'')}" class="field col-span-2"><button class="col-span-2 py-3 rounded-xl bg-purple-600 font-bold">Save</button></form>`;s.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.target,p={};['title','category','platform','price','tagline','description','image_url'].forEach(k=>p[k]=f[k].value.trim());const r=await updateGame(g.id,p);if(!r.error)renderList();}})}
async function renderRequests(){const rs=await fetchGameRequests(),c=document.getElementById('requests-list');c.innerHTML=rs.length?rs.map(r=>`<article data-request-id="${r.id}" class="rounded-2xl border border-white/10 bg-white/5 p-5 flex justify-between gap-4"><div><h3 class="font-bold">${esc(r.gamename)}</h3><p class="text-gray-400 text-sm">${esc(r.username)} · ${esc(r.email)}</p></div><div class="flex gap-3"><button data-convert class="text-cyan-400 text-sm">Add as Game</button><button data-dismiss class="text-red-400 text-sm">Dismiss</button></div></article>`).join(''):'<p class="text-gray-400 text-sm">No pending requests.</p>';c.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=async()=>{const a=b.closest('[data-request-id]'),r=await deleteGameRequest(a.dataset.requestId);if(!r.error)a.remove()});c.querySelectorAll('[data-convert]').forEach(b=>b.onclick=()=>{const a=b.closest('[data-request-id]'),f=document.getElementById('add-form');f.title.value=a.querySelector('h3').textContent;f.slug.value=f.title.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');f.dataset.fulfillsRequestId=a.dataset.requestId;f.scrollIntoView({behavior:'smooth',block:'center'});});}
document.getElementById('add-form').onsubmit=async e=>{e.preventDefault();const f=e.target,msg=document.getElementById('add-message'),r=await createGame({title:f.title.value.trim(),slug:f.slug.value.trim(),category:f.category.value.trim(),platform:f.platform.value.trim(),price:f.price.value.trim(),price_breakdown:f.price_breakdown.value.trim(),tagline:f.tagline.value.trim(),description:f.description.value.trim(),image_url:f.image_url.value.trim()});if(r.error){msg.textContent=r.error.message;return}if(f.dataset.fulfillsRequestId){await deleteGameRequest(f.dataset.fulfillsRequestId);delete f.dataset.fulfillsRequestId;await renderRequests()}f.reset();msg.textContent='Game added!';renderList()};
async function renderReports(){const rs=await fetchReports(),c=document.getElementById('reports-list'),p=rs.filter(r=>r.status==='pending');c.innerHTML=p.length?p.map(r=>`<article class="rounded-2xl border border-red-500/20 p-5 flex justify-between gap-4"><div><b>${esc(r.reported?.username||'Unknown')}</b>${rankBadge(r.reported?.role)}<p class="text-gray-400 text-sm">${esc(r.reason)}</p></div><div><button data-dismiss="${r.id}" class="text-gray-400 mr-3">Dismiss</button>${profile.role==='owner'?`<button data-ban="${r.id}" data-user="${r.reported_user_id}" class="text-red-400">Ban</button>`:''}</div></article>`).join(''):'<p class="text-gray-400 text-sm">No pending reports.</p>';c.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=async()=>{await updateReportStatus(b.dataset.dismiss,'dismissed');renderReports()});c.querySelectorAll('[data-ban]').forEach(b=>b.onclick=async()=>{const reason=prompt('Reason for ban:');if(reason!==null){await banUser(b.dataset.user,reason.trim()||null);await updateReportStatus(b.dataset.ban,'resolved');renderReports()}})}
await renderList();await renderRequests();await renderReports();}}
</script><style>.field{padding:.85rem 1rem;border-radius:1rem;background:#000;border:1px solid rgba(255,255,255,.1);outline:0}.field:focus{border-color:#22d3ee}</style></body></html>
