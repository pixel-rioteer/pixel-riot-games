<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | PIXEL-RIOT</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body class="min-h-screen bg-black text-white font-sans"><nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10"><div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"><a href="/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a><div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div></div></nav><main class="max-w-7xl mx-auto px-6 py-12" id="admin-main"><p class="text-gray-400">Checking access...</p></main><script type="module" src="/assets/pixel-riot-admin-access.js?v=20260917-5"></script><script type="module">import{requireAuth,blockIfBanned,getProfile,fetchGames,createGame,updateGame,deleteGame,escapeHtml,fetchGameRequests,deleteGameRequest,fetchReports,updateReportStatus,rankBadge,tagBadge}from"/assets/pixel-riot-app.js?v=20260917-5";(async()=>{const main=document.getElementById('admin-main');try{const s=await requireAuth();if(!s||await blockIfBanned())return;const me=await getProfile();if(!me?.is_admin){main.innerHTML='<div class="panel muted">You need admin access to view this page.</div>';return}const can=p=>me.role==='owner'||me.permissions?.[p]===true;const groups={Games:[['manage_games_view','View games'],['manage_games_create','Create games'],['manage_games_edit','Edit game content'],['manage_games_delete','Delete games'],['manage_page_builder','Use page builder']],Requests:[['manage_requests_view','View requests'],['manage_requests_dismiss','Dismiss requests']],Reports:[['manage_reports_view','View reports'],['manage_reports_resolve','Resolve reports'],['manage_reports_dismiss','Dismiss reports'],['manage_reports_ban','Ban users']]};main.innerHTML=`<div class="mb-10"><p class="text-cyan-400 uppercase tracking-[0.3em] text-xs font-black">PIXEL-RIOT CONTROL ROOM</p><h1 class="text-5xl md:text-6xl font-black mt-3">Admin</h1><p class="muted mt-3">Games, page builder, moderation and managed accounts.</p></div>${can('manage_reports_view')?`<section class="panel"><h2>Reports & Moderation</h2><div id="reports-list" class="space-y-3"></div></section>`:''}${can('manage_requests_view')?`<section class="panel"><h2>Game Requests</h2><div id="requests-list" class="space-y-3"></div></section>`:''}${me.role==='owner'?`<section class="panel"><div class="flex items-start justify-between gap-4"><div><h2>Managed Accounts</h2><p class="muted">Rank, tag, authorization, page access and every permission are controlled separately.</p></div><span class="tag">OWNER ONLY</span></div><form id="user-form" class="grid md:grid-cols-2 gap-4 mt-6"><input name="username" required placeholder="Username" class="field"><input name="email" required type="email" placeholder="Email" class="field"><input name="password" required minlength="8" type="password" placeholder="Temporary password (8+ chars)" class="field"><button class="md:col-span-2 py-4 rounded-2xl bg-cyan-500 text-black font-black">Create Account</button><p id="user-message" class="md:col-span-2 text-sm"></p></form><div id="users-list" class="mt-8 space-y-2"></div></section>`:''}${can('manage_games_create')?`<section class="panel"><h2>Add a Game</h2><form id="add-form" class="grid md:grid-cols-2 gap-4 mt-5"><input name="title" placeholder="Title" required class="field"><input name="slug" placeholder="slug-like-this" required class="field"><input name="category" placeholder="Category" class="field"><input name="platform" placeholder="Platform(s)" class="field"><input name="price" placeholder="Price" class="field"><input name="price_breakdown" placeholder="Price breakdown" class="field"><input name="image_url" placeholder="Image URL" class="field md:col-span-2"><input name="tagline" placeholder="Tagline" class="field md:col-span-2"><textarea name="description" placeholder="Description" rows="4" class="field md:col-span-2"></textarea><button class="md:col-span-2 py-4 rounded-2xl bg-cyan-500 text-black font-black">Add Game</button><p id="add-message" class="md:col-span-2 text-sm"></p></form></section>`:''}${can('manage_games_view')||can('manage_page_builder')?`<section><div class="mb-5"><h2 class="text-2xl font-black">Games & Page Builder</h2><p class="muted mt-1">Build and style each game page.</p></div><div id="games-admin-list" class="space-y-4"></div></section>`:''}`;async function renderGames(){const c=document.getElementById('games-admin-list');if(!c)return;const gs=await fetchGames();c.innerHTML=gs.map(g=>`<article data-game-id="${g.id}" class="game-row"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4"><div><h3 class="text-xl font-black">${escapeHtml(g.title)}</h3><p class="muted mt-1">${escapeHtml(g.slug)} · ${escapeHtml(g.category||'')}</p></div><div class="flex gap-3 flex-wrap">${can('manage_page_builder')?`<button data-action-builder class="action-cyan">Page Builder</button>`:''}${can('manage_games_edit')?`<button data-edit class="action-purple">Edit</button>`:''}${can('manage_games_delete')?`<button data-delete class="action-red">Delete</button>`:''}</div></div><div data-builder-slot></div><div data-edit-slot></div></article>`).join('')||'<p class="muted">No games.</p>';c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const g=gs.find(x=>String(x.id)===b.closest('[data-game-id]').dataset.gameId),slot=b.closest('[data-game-id]').querySelector('[data-edit-slot]');slot.innerHTML=`<form class="mt-4 grid md:grid-cols-2 gap-3"><input name="title" value="${escapeHtml(g.title)}" class="field"><input name="category" value="${escapeHtml(g.category||'')}" class="field"><input name="platform" value="${escapeHtml(g.platform||'')}" class="field"><input name="price" value="${escapeHtml(g.price||'')}" class="field"><input name="tagline" value="${escapeHtml(g.tagline||'')}" class="field md:col-span-2"><input name="image_url" value="${escapeHtml(g.image_url||'')}" class="field md:col-span-2"><textarea name="description" class="field md:col-span-2">${escapeHtml(g.description||'')}</textarea><button class="md:col-span-2 py-3 rounded-xl bg-purple-600 font-black">Save content</button></form>`;slot.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.target,r=await updateGame(g.id,{title:f.title.value.trim(),category:f.category.value.trim(),platform:f.platform.value.trim(),price:f.price.value.trim(),tagline:f.tagline.value.trim(),image_url:f.image_url.value.trim(),description:f.description.value.trim()});if(r.error)alert(r.error.message);else renderGames()}});c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this game?'))return;const r=await deleteGame(b.closest('[data-game-id]').dataset.gameId);if(r.error)alert(r.error.message);else renderGames()})}async function renderRequests(){const c=document.getElementById('requests-list');if(!c)return;const rs=await fetchGameRequests();c.innerHTML=rs.length?rs.map(r=>`<article class="request"><div><b>${escapeHtml(r.gamename)}</b><p class="muted">${escapeHtml(r.username||'')} · ${escapeHtml(r.email||'')}</p></div>${can('manage_requests_dismiss')?`<button data-request="${r.id}" class="action-red">Dismiss & delete</button>`:''}</article>`).join(''):'<p class="muted">No pending requests.</p>';c.querySelectorAll('[data-request]').forEach(b=>b.onclick=async()=>{if(!confirm('Permanently delete this request?'))return;const r=await deleteGameRequest(b.dataset.request);if(r.error)alert(r.error.message);else renderRequests()})}async function renderReports(){const c=document.getElementById('reports-list');if(!c)return;const rs=(await fetchReports()).filter(r=>r.status==='pending');c.innerHTML=rs.length?rs.map(r=>`<article class="request"><div><b>${escapeHtml(r.reported?.username||'Unknown')}${rankBadge(r.reported?.role)}${tagBadge(r.reported?.tag)}</b><p class="muted mt-1">${escapeHtml(r.reason)}</p></div><div class="flex gap-3">${can('manage_reports_resolve')?`<button data-report="resolved" data-id="${r.id}" class="action-cyan">Resolve</button>`:''}${can('manage_reports_dismiss')?`<button data-report="dismissed" data-id="${r.id}" class="action-red">Dismiss</button>`:''}</div></article>`).join(''):'<p class="muted">No pending reports.</p>';c.querySelectorAll('[data-report]').forEach(b=>b.onclick=async()=>{const r=await updateReportStatus(b.dataset.id,b.dataset.report);if(r.error)alert(r.error.message);else renderReports()})}const add=document.getElementById('add-form');if(add)add.onsubmit=async e=>{e.preventDefault();const f=e.target,r=await createGame({title:f.title.value.trim(),slug:f.slug.value.trim(),category:f.category.value.trim(),platform:f.platform.value.trim(),price:f.price.value.trim(),price_breakdown:f.price_breakdown.value.trim(),tagline:f.tagline.value.trim(),description:f.description.value.trim(),image_url:f.image_url.value.trim()});const m=document.getElementById('add-message');if(r.error)m.textContent=r.error.message;else{m.textContent='Game added.';f.reset();renderGames()}};await Promise.all([renderGames(),renderRequests(),renderReports()])}catch(e){console.error(e);main.innerHTML=`<div class="panel"><h2 class="text-red-400">Admin failed to load</h2><p class="muted mt-2">${escapeHtml(e?.message||String(e))}</p><button class="primary mt-4" onclick="location.reload()">Retry</button></div>`}})();</script><style>.panel{margin-bottom:2.5rem;padding:2rem;border:1px solid rgba(255,255,255,.1);border-radius:1.5rem;background:rgba(10,10,10,.9)}.panel h2{font-size:1.5rem;font-weight:900;margin-bottom:.5rem}.muted{color:#71717a;font-size:.875rem}.field{width:100%;padding:.85rem 1rem;border-radius:.9rem;background:#050505;border:1px solid rgba(255,255,255,.1);color:#fff;outline:0}.field:focus{border-color:#22d3ee}.game-row,.request{padding:1.25rem;border:1px solid rgba(255,255,255,.1);border-radius:1.25rem;background:rgba(255,255,255,.03)}.request{display:flex;align-items:center;justify-content:space-between;gap:1rem}.action-cyan{color:#22d3ee;font-weight:800}.action-purple{color:#c084fc;font-weight:800}.action-red{color:#f87171;font-weight:800}.tag{font-size:.7rem;font-weight:900;color:#facc15;border:1px solid rgba(250,204,21,.3);padding:.35rem .6rem;border-radius:.7rem}.check{display:flex;gap:.6rem;align-items:center;padding:.55rem .65rem;color:#d4d4d8}.permission-group{border:1px solid rgba(255,255,255,.08);border-radius:1rem;padding:1rem;background:#050505}.permission-group h4{font-weight:900;margin-bottom:.5rem;color:#22d3ee}.builder{margin-top:1.25rem;border:1px solid rgba(34,211,238,.2);border-radius:1.25rem;overflow:hidden;background:#070707}.builder-toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.08)}.primary{background:#22d3ee;color:#001014;font-weight:900;padding:.7rem 1rem;border-radius:.8rem}.secondary{border:1px solid rgba(255,255,255,.1);padding:.7rem 1rem;border-radius:.8rem}.layout-card{border:1px solid rgba(255,255,255,.08);border-radius:.8rem;background:rgba(255,255,255,.03);padding:.35rem}.layout-row{display:flex;align-items:center;gap:.75rem;padding:.5rem}.drag{color:#71717a}.visibility{color:#22d3ee}.element-editor{padding:.5rem;display:grid;gap:.5rem;border-top:1px solid rgba(255,255,255,.06)}.style-editor{padding:.5rem;border-top:1px solid rgba(255,255,255,.06)}.preview{border:1px solid;border-radius:1.25rem;padding:1.25rem;min-height:300px}</style></body></html>
