function layoutFor(g){return Array.isArray(g.page_layout)&&g.page_layout.length?JSON.parse(JSON.stringify(g.page_layout)):Object.keys({hero:1,image:1,description:1,info:1,price:1,tips:1,known_issues:1,secrets_cheats:1,commands_reference:1,elements_reference:1,reviews:1}).map(type=>({id:crypto.randomUUID(),type,visible:true}))}

function tableHtml(el,t,preview=true){const p=el.props||{},cols=Array.isArray(p.columns)&&p.columns.length?p.columns:['Column 1','Column 2'];const rows=Array.isArray(p.rows)&&p.rows.length?p.rows:[['Value 1','Value 2']];return `<div class="element-table" style="border-color:${t.accent}55"><table><thead><tr>${cols.map(c=>`<th style="background:${t.surface}">${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map((_,i)=>`<td>${escapeHtml(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table>${p.caption?`<p class="caption">${escapeHtml(p.caption)}</p>`:''}</div>`}

function preview(g,t,l){return `<div class="preview" style="background:${t.background};color:${t.text};border-color:${t.accent}66"><div class="preview-label" style="color:${t.accent}">${escapeHtml(g.category||'GAME')}</div>${l.filter(x=>x.visible!==false).map(x=>{switch(x.type){case'hero':return`<div><div class="text-4xl md:text-5xl font-black">${escapeHtml(g.title||'Game title')}</div><div class="opacity-70 mt-2">${escapeHtml(g.tagline||'Your tagline appears here.')}</div></div>`;case'image':return`<div class="rounded-2xl bg-cover bg-center border" style="height:${Math.min(600,Math.max(100,Number(x.props?.maxHeight)||240))}px;width:${Math.min(100,Math.max(10,Number(x.props?.width)||100))}%;margin:${x.props?.align==='left'?'0 auto 0 0':x.props?.align==='right'?'0 0 0 auto':'0 auto'};background-image:url('${escapeHtml(g.image_url||'')}');background-size:${x.props?.fit||'contain'};background-repeat:no-repeat;border-color:${t.accent}55"></div>`;case'description':return`<section><h3>About</h3><p>${escapeHtml(g.description||'Your description appears here.')}</p></section>`;case'info':return`<div class="flex flex-wrap gap-2"><span class="chip" style="background:${t.surface}">${escapeHtml(g.platform||'Platform')}</span><span class="chip" style="background:${t.surface}">${escapeHtml(g.category||'Category')}</span></div>`;case'price':return`<section><h3>Price</h3><strong style="color:${t.accent}">${escapeHtml(g.price||'Price')}</strong><p>${escapeHtml(g.price_breakdown||'')}</p></section>`;default:return elementPreview(x,t,g)}}).join('')}</div>`}
function propEditor(x){const p=x.props||{};if(x.type==='table')return`<div class="element-editor"><input data-prop="caption" value="${escapeHtml(p.caption||'')}" placeholder="Table caption" class="field"><input data-prop="columns" value="${escapeHtml((p.columns||['Column 1','Column 2']).join(' | '))}" placeholder="Columns separated by |" class="field"><textarea data-prop="rows" rows="5" placeholder="One row per line, cells separated by |" class="field">${escapeHtml((p.rows||[['Value 1','Value 2']]).map(r=>r.join(' | ')).join('\n'))}</textarea></div>`;if(['heading','text','callout','button'].includes(x.type))return`<div class="element-editor">${x.type==='callout'?`<input data-prop="title" value="${escapeHtml(p.title||'Callout')}" placeholder="Title" class="field">`:''}<textarea data-prop="text" rows="3" placeholder="${labels[x.type]} content" class="field">${escapeHtml(p.text||'')}</textarea></div>`;if(x.type==='list')return`<div class="element-editor"><textarea data-prop="items" rows="4" placeholder="One list item per line" class="field">${escapeHtml(p.items||'')}</textarea></div>`;if(x.type==='image')return`<div class="element-editor"><input data-prop="url" value="${escapeHtml(p.url||'')}" placeholder="Image URL" class="field"><div class="grid grid-cols-2 gap-2"><label class="muted text-xs">Width %<input data-prop="width" type="number" min="10" max="100" value="${Number(p.width)||100}" class="field mt-1"></label><label class="muted text-xs">Max height px<input data-prop="maxHeight" type="number" min="100" max="1600" step="10" value="${Number(p.maxHeight)||1600}" class="field mt-1"></label><label class="muted text-xs">Fit<select data-prop="fit" class="field mt-1"><option value="contain" ${p.fit==='contain'?'selected':''}>Contain</option><option value="cover" ${p.fit==='cover'?'selected':''}>Cover</option><option value="fill" ${p.fit==='fill'?'selected':''}>Fill</option></select></label><label class="muted text-xs">Alignment<select data-prop="align" class="field mt-1 function builder(g,article){const slot=article.querySelector('[data-builder-slot]');if(slot.innerHTML){slot.innerHTML='';return}let t=themeFor(g),l=layoutFor(g);const render=()=>{slot.innerHTML=`<div class="builder"><div class="builder-toolbar"><div><span class="muted">PAGE BUILDER</span><h3 class="text-xl font-black mt-1">${escapeHtml(g.title)}</h3></div><div class="flex gap-2"><button data-save class="primary">Save page</button><button data-close class="secondary">Close</button></div></div><div class="grid xl:grid-cols-2 gap-6 p-5"><div><h4>Theme presets</h4><div class="flex flex-wrap gap-2 mt-3">${Object.keys(presets).map(p=>`<button data-preset="${p}" class="preset ${t.preset===p?'selected':''}">${p}</button>`).join('')}</div><h4 class="mt-6">Game content</h4><div class="grid sm:grid-cols-2 gap-3 mt-3">${fields.map(([f,n])=>['description','tips','known_issues','secrets_cheats','commands_reference','elements_reference'].includes(f)?`<textarea data-field="${f}" rows="3" placeholder="${n}" class="field sm:col-span-2">${escapeHtml(g[f]||'')}</textarea>`:`<input data-field="${f}" placeholder="${n}" value="${escapeHtml(g[f]||'')}" class="field">`).join('')}</div><h4 class="mt-6">Add element</h4><div class="flex gap-2 mt-3"><select data-new-element class="field"><option value="">Choose an element...</option>${customTypes.map(x=>`<option value="${x}">${labels[x]}</option>`).join('')}</select><button data-add-element class="primary">Add</button></div><p class="muted mt-2">Tables support custom columns and rows. Other elements include headings, text, callouts, lists, images, dividers and buttons.</p></div><div><div class="flex items-center justify-between"><h4>Page layout</h4><span class="muted text-xs">Drag to reorder</span></div><div class="space-y-2 mt-3">${l.map((x,i)=>`<div draggable="true" data-i="${i}" class="layout-card"><div class="layout-row"><span class="drag">☷</span><span class="flex-1"><b>${labels[x.type]||x.type}</b>${customTypes.includes(x.type)?`<span class="muted ml-2">custom element</span>`:''}</span><button type="button" data-toggle="${i}" class="visibility ${x.visible===false?'off':''}">${x.visible===false?'○':'●'}</button>${customTypes.includes(x.type)?`<button type="button" data-remove="${i}" class="action-red">Remove</button>`:''}</div>${customTypes.includes(x.type)?propEditor(x):''}</div>`).join('')}</div><h4 class="mt-6 mb-3">Live preview</h4><div data-preview>${preview(g,t,l)}</div></div></div></div>`;wire()};const wire=()=>{slot.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{t={...presets[b.dataset.preset],preset:b.dataset.preset};render()});slot.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{g[e.dataset.field]=e.value;slot.querySelector('[data-preview]').innerHTML=preview(g,t,l)});slot.querySelectorAll('[data-prop]').forEach(e=>{const update=()=>{const row=e.closest('[data-i]'),idx=row?+row.dataset.i:-1;if(idx<0)return;const x=l[idx];x.props=x.props||{};if(e.dataset.prop==='columns')x.props.columns=e.value.split('|').map(v=>v.trim()).filter(Boolean);else if(e.dataset.prop==='rows')x.props.rows=e.value.split('\n').map(r=>r.split('|').map(v=>v.trim()));else if(['width','maxHeight'].includes(e.dataset.prop))x.props[e.dataset.prop]=Math.max(e.dataset.prop==='width'?10:100,Number(e.value)||0);else x.props[e.dataset.prop]=e.value;slot.querySelector('[data-preview]').innerHTML=preview(g,t,l)};e.oninput=update;e.onchange=update});slot.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{l[+b.dataset.toggle].visible=l[+b.dataset.toggle].visible===false;render()});slot.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{l.splice(+b.dataset.remove,1);render()});slot.querySelector('[data-add-element]').onclick=()=>{const type=slot.querySelector('[data-new-element]').value;if(!type)return;l.push({id:crypto.randomUUID(),type,visible:true,props:type==='table'?{caption:'',columns:['Column 1','Column 2'],rows:[['Value 1','Value 2']]}:type==='image'?{width:100,maxHeight:1600,fit:'contain',align:'center'}:{}});render()};let drag=null;slot.querySelectorAll('[data-i]').forEach(row=>{row.ondragstart=()=>drag=+row.dataset.i;row.ondragover=e=>e.preventDefault();row.ondrop=()=>{const to=+row.dataset.i;if(drag===null||drag===to)return;const item=l.splice(drag,1)[0];l.splice(to,0,item);render()}});slot.querySelector('[data-close]').onclick=()=>slot.innerHTML='';slot.querySelector('[data-save]').onclick=async()=>{const b=slot.querySelector('[data-save]');b.disabled=true;b.textContent='Saving...';const content={};fields.forEach(([f])=>content[f]=g[f]||'');const r=await saveGamePage(g.id,t,l,content);if(r.error){b.disabled=false;b.textContent='Save page';alert(`Could not save page: ${r.error.message}`);return}Object.assign(g,r.data);b.textContent='Saved ✓';setTimeout(()=>{b.disabled=false;b.textContent='Save page'},1200)}};render()}
async function renderGames(){if(!can('manage_games_view')&&!can('manage_page_builder'))return;const games=await fetchGames(),c=document.getElementById('games-admin-list');if(!c)return;c.innerHTML=games.map(g=>`<article data-game-id="${g.id}" class="game-row"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4"><div><h3 class="text-xl font-black">${escapeHtml(g.title)}</h3><p class="muted mt-1">${escapeHtml(g.slug)} · ${escapeHtml(g.category||'')}</p></div><div class="flex gap-3">${can('manage_page_builder')?`<button data-action-builder class="action-cyan">Page Builder</button>`:''}${can('manage_games_edit')?`<button data-edit class="action-purple">Edit</button>`:''}${can('manage_games_delete')?`<button data-delete class="action-red">Delete</button>`:''}</div></div><div data-builder-slot></div><div data-edit-slot></div></article>`).join('');c.querySelectorAll('[data-action-builder]').forEach(b=>b.onclick=()=>builder(games.find(x=>x.id===b.closest('[data-game-id]').dataset.gameId),b.closest('[data-game-id]')));c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this game?'))return;const r=await deleteGame(b.closest('[data-game-id]').dataset.gameId);if(r.error)alert(r.error.message);else renderGames()});c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const g=games.find(x=>x.id===b.closest('[data-game-id]').dataset.gameId),s=b.closest('[data-game-id]').querySelector('[data-edit-slot]');s.innerHTML=`<form class="mt-4 grid md:grid-cols-2 gap-3"><input name="title" value="${escapeHtml(g.title)}" class="field"><input name="category" value="${escapeHtml(g.category||'')}" class="field"><input name="platform" value="${escapeHtml(g.platform||'')}" class="field"><input name="price" value="${escapeHtml(g.price||'')}" class="field"><input name="tagline" value="${escapeHtml(g.tagline||'')}" class="field md:col-span-2"><textarea name="description" class="field md:col-span-2">${escapeHtml(g.description||'')}</textarea><input name="image_url" value="${escapeHtml(g.image_url||'')}" class="field md:col-span-2"><button class="md:col-span-2 py-3 rounded-xl bg-purple-600 font-black">Save content</button></form>`;s.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.target,p={};['title','category','platform','price','tagline','description','image_url'].forEach(k=>p[k]=f[k].value.trim());const r=await updateGame(g.id,p);if(r.error)alert(r.error.message);else renderGames()}})}
async function renderRequests(){if(!can('manage_requests_view'))return;const c=document.getElementById('requests-list'),rs=await fetchGameRequests();c.innerHTML=rs.length?rs.map(r=>`<article class="request"><div><b>${escapeHtml(r.gamename)}</b><p class="muted">${escapeHtml(r.username)} · ${escapeHtml(r.email)}</p></div>${can('manage_requests_dismiss')?`<button data-id="${r.id}" class="action-red">Dismiss & delete</button>`:''}</article>`).join(''):'<p class="muted">No pending requests.</p>';c.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Dismiss and permanently delete this request?'))return;const r=await deleteGameRequest(b.dataset.id);if(r.error)alert(r.error.message);else renderRequests()})}
async function renderReports(){if(!can('manage_reports_view'))return;const c=document.getElementById('reports-list'),rs=await fetchReports(),p=rs.filter(r=>r.status==='pending');c.innerHTML=p.length?p.map(r=>`<article class="request"><div><b>${escapeHtml(r.reported?.username||'Unknown')}${rankBadge(r.reported?.role)}${tagBadge(r.reported?.tag)}</b><p class="muted mt-1">${escapeHtml(r.reason)}</p></div><div class="flex gap-3">${can('manage_reports_resolve')?`<button data-status="resolved" data-id="${r.id}" class="action-cyan">Resolve</button>`:''}${can('manage_reports_dismiss')?`<button data-status="dismissed" data-id="${r.id}" class="action-red">Dismiss</button>`:''}</div></article>`).join(''):'<p class="muted">No pending reports.</p>';c.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const r=await updateReportStatus(b.dataset.id,b.dataset.status);if(r.error)alert(r.error.message);else renderReports()})}
async function renderUsers(){const c=document.getElementById('users-list');if(!c)return;const r=await fetchProfiles();if(r.error){c.innerHTML=`<p class="text-red-400">${escapeHtml(r.error.message)}</p>`;return}c.innerHTML=r.data.map(u=>`<div class="request"><div><b>${escapeHtml(u.username)} ${rankBadge(u.role)}${tagBadge(u.tag)}</b><p class="muted">${escapeHtml(u.role)} · ${Object.entries(u.permissions||{}).filter(([,v])=>v).map(([k])=>escapeHtml(k.replaceAll('_',' '))).join(', ')||'No extra permissions'}${u.banned?' · BANNED':''}</p></div></div>`).join('')||'<p class="muted">No profiles found.</p>'}
const add=document.getElementById('add-form');if(add)add.onsubmit=async e=>{e.preventDefault();const f=e.target,m=document.getElementById('add-message'),r=await createGame({title:f.title.value.trim(),slug:f.slug.value.trim(),category:f.category.value.trim(),platform:f.platform.value.trim(),price:f.price.value.trim(),price_breakdown:f.price_breakdown.value.trim(),tagline:f.tagline.value.trim(),description:f.description.value.trim(),image_url:f.image_url.value.trim()});if(r.error)m.textContent=r.error.message;else{m.textContent='Game added.';f.reset();renderGames()}};
const uf=document.getElementById('user-form');if(uf)uf.onsubmit=async e=>{e.preventDefault();const f=e.target,m=document.getElementById('user-message'),permissions={};Object.values(permissionGroups).flat().forEach(([k])=>permissions[k]=f[k].checked);const tag=f.custom_tag.value.trim()||f.tag.value,r=await createManagedUser({username:f.username.value.trim(),email:f.email.value.trim(),password:f.password.value,tag,role:f.role.value,permissions});if(r.error)m.textContent=r.error.message;else{m.textContent=`Created ${r.data.user.username} with tag ${r.data.user.tag}.`;f.reset();renderUsers()}};
await Promise.all([renderGames(),renderRequests(),renderReports(),renderUsers()]);}}
