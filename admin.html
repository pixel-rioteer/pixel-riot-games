<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | PIXEL-RIOT</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body class="min-h-screen bg-black text-white font-sans"><nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10"><div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"><a href="home/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a><div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div></div></nav><main class="max-w-7xl mx-auto px-6 py-12" id="admin-main"><p class="text-gray-400">Checking access...</p></main><script type="module">
import{requireAuth,getProfile,blockIfBanned,fetchGames,createGame,updateGame,deleteGame,escapeHtml,fetchGameRequests,deleteGameRequest,fetchReports,updateReportStatus,rankBadge,tagBadge,saveGamePage,createManagedUser,fetchProfiles}from"/assets/pixel-riot-app.js";
const session=await requireAuth();if(session&&!(await blockIfBanned())){const me=await getProfile(),main=document.getElementById('admin-main');if(!me?.is_admin)main.innerHTML='<div class="panel muted">You need admin access to view this page.</div>';else{const perms=me.permissions||{};const can=p=>me.role==='owner'||me.role==='admin'||!!perms[p];main.innerHTML=`<div class="mb-10"><p class="text-cyan-400 uppercase tracking-[0.3em] text-xs font-black">PIXEL-RIOT CONTROL ROOM</p><h1 class="text-5xl md:text-6xl font-black mt-3">Admin</h1><p class="muted mt-3">Manage games, pages, moderation and accounts.</p></div>${can('manage_reports')?`<section class="panel"><h2>Reports & Moderation</h2><div id="reports-list" class="space-y-3"></div></section>`:''}${can('manage_requests')?`<section class="panel"><h2>Game Requests</h2><p class="muted mb-5">Dismiss permanently deletes the request.</p><div id="requests-list" class="space-y-3"></div></section>`:''}${me.role==='owner'?`<section class="panel"><div class="flex items-start justify-between gap-5"><div><h2>Managed Accounts</h2><p class="muted">Create accounts with a custom tag and exactly the permissions you choose.</p></div><span class="tag">OWNER ONLY</span></div><form id="user-form" class="grid md:grid-cols-2 gap-4 mt-6"><input name="username" required placeholder="Username" class="field"><input name="email" required type="email" placeholder="Email" class="field"><input name="password" required minlength="8" type="password" placeholder="Temporary password (8+ chars)" class="field"><select name="tag" class="field"><option>Developer</option><option>Moderator</option><option>Reviewer</option><option>Partner</option><option>Tester</option><option>VIP</option><option>Community Team</option><option>Member</option></select><input name="custom_tag" placeholder="Custom tag (optional)" class="field"><select name="role" class="field"><option value="member">Member</option><option value="moderator">Moderator</option><option value="admin">Admin</option></select><div class="md:col-span-2 grid sm:grid-cols-2 gap-3">${[['manage_games','Manage games'],['manage_requests','Manage game requests'],['manage_reports','Manage reports & moderation'],['manage_users','Manage accounts']].map(([k,l])=>`<label class="check"><input type="checkbox" name="${k}"><span>${l}</span></label>`).join('')}</div><button class="md:col-span-2 py-4 rounded-2xl bg-cyan-500 text-black font-black hover:bg-cyan-400">Create Account</button><p id="user-message" class="md:col-span-2 text-sm"></p></form><div id="users-list" class="mt-8 space-y-2"></div></section>`:''}${can('manage_games')?`<section class="panel"><h2>Add a Game</h2><form id="add-form" class="grid md:grid-cols-2 gap-4 mt-5"><input name="title" placeholder="Title" required class="field"><input name="slug" placeholder="slug-like-this" required class="field"><input name="category" placeholder="Category" class="field"><input name="platform" placeholder="Platform(s)" class="field"><input name="price" placeholder="Price" class="field"><input name="price_breakdown" placeholder="Per-platform breakdown" class="field"><input name="image_url" placeholder="Image URL" class="field md:col-span-2"><input name="tagline" placeholder="Tagline" class="field md:col-span-2"><textarea name="description" placeholder="Description" rows="4" class="field md:col-span-2"></textarea><button class="md:col-span-2 py-4 rounded-2xl bg-cyan-500 text-black font-black">Add Game</button><p id="add-message" class="md:col-span-2 text-sm"></p></form></section><section><div class="mb-5"><h2 class="text-2xl font-black">Games & Page Builder</h2><p class="muted mt-1">Edit content, drag sections, choose a preset and save with a live preview.</p></div><div id="games-admin-list" class="space-y-4"></div></section>`:''}`;
const presets={neon:{accent:'#22d3ee',background:'#050505',surface:'#0a0a0a',text:'#f4f4f5'},purple:{accent:'#a855f7',background:'#08050d',surface:'#120b1d',text:'#faf5ff'},fire:{accent:'#fb923c',background:'#0b0502',surface:'#1a0c05',text:'#fff7ed'},ice:{accent:'#60a5fa',background:'#031018',surface:'#071a25',text:'#eff6ff'},lime:{accent:'#a3e635',background:'#071007',surface:'#0d1a0d',text:'#f7fee7'}};
const labels={hero:'Hero',image:'Cover Image',description:'Description',info:'Game Info',price:'Price',tips:'Tips',known_issues:'Known Issues',secrets_cheats:'Secrets & Cheats',commands_reference:'Commands Reference',elements_reference:'Elements Reference',reviews:'Player Reviews'};
const fields=[['title','Title'],['category','Category'],['tagline','Tagline'],['image_url','Image URL'],['platform','Platform'],['price','Price'],['price_breakdown','Price breakdown'],['description','Description'],['tips','Tips'],['known_issues','Known issues'],['secrets_cheats','Secrets & cheats'],['commands_reference','Commands reference'],['elements_reference','Elements reference']];
const esc=escapeHtml;function layoutFor(g){return Array.isArray(g.page_layout)&&g.page_layout.length?JSON.parse(JSON.stringify(g.page_layout)):Object.keys(labels).map(type=>({id:type,type,visible:true}))}function themeFor(g){return JSON.parse(JSON.stringify(g.page_theme||presets.neon))}
function preview(g,t,l){return `<div class="preview" style="background:${t.background};color:${t.text};border-color:${t.accent}66"><div class="preview-label" style="color:${t.accent}">${esc(g.category||'GAME')}</div>${l.filter(x=>x.visible!==false).map(x=>{switch(x.type){case'hero':return`<div><div class="text-4xl md:text-5xl font-black">${esc(g.title||'Game title')}</div><div class="opacity-70 mt-2">${esc(g.tagline||'Your tagline appears here.')}</div></div>`;case'image':return`<div class="h-48 rounded-2xl bg-cover bg-center border" style="background-image:url('${esc(g.image_url||'')}');border-color:${t.accent}55"></div>`;case'description':return`<section><h3>About</h3><p>${esc(g.description||'Your description appears here.')}</p></section>`;case'info':return`<div class="flex flex-wrap gap-2"><span class="chip" style="background:${t.surface}">${esc(g.platform||'Platform')}</span><span class="chip" style="background:${t.surface}">${esc(g.category||'Category')}</span></div>`;case'price':return`<section><h3>Price</h3><strong style="color:${t.accent}">${esc(g.price||'Price')}</strong><p>${esc(g.price_breakdown||'')}</p></section>`;default:return`<section><h3>${labels[x.type]||x.type}</h3><p>${esc(g[x.type]||'Add this content in the editor.')}</p></section>`}}).join('')}</div>`}
function builder(g,article){const slot=article.querySelector('[data-builder]');if(slot.innerHTML){slot.innerHTML='';return}let t=themeFor(g),l=layoutFor(g);const render=()=>{slot.innerHTML=`<div class="builder"><div class="builder-toolbar"><div><span class="muted">PAGE BUILDER</span><h3 class="text-xl font-black mt-1">${esc(g.title)}</h3></div><div class="flex gap-2"><button data-save class="primary">Save page</button><button data-close class="secondary">Close</button></div></div><div class="grid xl:grid-cols-2 gap-6 p-5"><div><h4>Theme presets</h4><div class="flex flex-wrap gap-2 mt-3">${Object.keys(presets).map(p=>`<button data-preset="${p}" class="preset ${t.preset===p?'selected':''}">${p}</button>`).join('')}</div><h4 class="mt-6">Content</h4><div class="grid sm:grid-cols-2 gap-3 mt-3">${fields.map(([f,n])=>['description','tips','known_issues','secrets_cheats','commands_reference','elements_reference'].includes(f)?`<textarea data-field="${f}" rows="3" placeholder="${n}" class="field sm:col-span-2">${esc(g[f]||'')}</textarea>`:`<input data-field="${f}" placeholder="${n}" value="${esc(g[f]||'')}" class="field">`).join('')}</div></div><div><div class="flex items-center justify-between"><h4>Page layout</h4><span class="muted text-xs">Drag to reorder</span></div><div class="space-y-2 mt-3">${l.map((x,i)=>`<div draggable="true" data-i="${i}" class="layout-row"><span class="drag">☷</span><span class="flex-1">${labels[x.type]||x.type}</span><button data-toggle="${i}" class="visibility ${x.visible===false?'off':''}">${x.visible===false?'○':'●'}</button></div>`).join('')}</div><h4 class="mt-6 mb-3">Live preview</h4><div data-preview>${preview(g,t,l)}</div></div></div></div>`;wire()};const wire=()=>{slot.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{t={...presets[b.dataset.preset],preset:b.dataset.preset};render()});slot.querySelectorAll('[data-field]').forEach(e=>e.oninput=()=>{g[e.dataset.field]=e.value;slot.querySelector('[data-preview]').innerHTML=preview(g,t,l)});slot.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{l[+b.dataset.toggle].visible=l[+b.dataset.toggle].visible===false;render()});let drag=null;slot.querySelectorAll('[data-i]').forEach(row=>{row.ondragstart=()=>drag=+row.dataset.i;row.ondragover=e=>e.preventDefault();row.ondrop=()=>{const to=+row.dataset.i;if(drag===null||drag===to)return;const item=l.splice(drag,1)[0];l.splice(to,0,item);render()}});slot.querySelector('[data-close]').onclick=()=>slot.innerHTML='';slot.querySelector('[data-save]').onclick=async()=>{const b=slot.querySelector('[data-save]');b.disabled=true;b.textContent='Saving...';const r=await saveGamePage(g.id,t,l);if(r.error){b.disabled=false;b.textContent='Save page';alert(`Could not save page: ${r.error.message}`);return}Object.assign(g,r.data);b.textContent='Saved ✓';setTimeout(()=>{b.disabled=false;b.textContent='Save page'},1000)}};render()}
async function renderGames(){if(!can('manage_games'))return;const games=await fetchGames(),c=document.getElementById('games-admin-list');c.innerHTML=games.map(g=>`<article data-game-id="${g.id}" class="game-row"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4"><div><h3 class="text-xl font-black">${esc(g.title)}</h3><p class="muted mt-1">${esc(g.slug)} · ${esc(g.category||'')}</p></div><div class="flex gap-3"><button data-builder class="action-cyan">Page Builder</button><button data-edit class="action-purple">Edit</button><button data-delete class="action-red">Delete</button></div></div><div data-builder></div><div data-edit-slot></div></article>`).join('');c.querySelectorAll('[data-builder]').forEach(b=>b.onclick=()=>builder(games.find(x=>x.id===b.closest('[data-game-id]').dataset.gameId),b.closest('[data-game-id]')));c.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this game?'))return;const r=await deleteGame(b.closest('[data-game-id]').dataset.gameId);if(r.error)alert(r.error.message);else renderGames()});c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const g=games.find(x=>x.id===b.closest('[data-game-id]').dataset.gameId),s=b.closest('[data-game-id]').querySelector('[data-edit-slot]');s.innerHTML=`<form class="mt-4 grid md:grid-cols-2 gap-3"><input name="title" value="${esc(g.title)}" class="field"><input name="category" value="${esc(g.category||'')}" class="field"><input name="platform" value="${esc(g.platform||'')}" class="field"><input name="price" value="${esc(g.price||'')}" class="field"><input name="tagline" value="${esc(g.tagline||'')}" class="field md:col-span-2"><textarea name="description" class="field md:col-span-2">${esc(g.description||'')}</textarea><input name="image_url" value="${esc(g.image_url||'')}" class="field md:col-span-2"><button class="md:col-span-2 py-3 rounded-xl bg-purple-600 font-black">Save content</button></form>`;s.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.target,p={};['title','category','platform','price','tagline','description','image_url'].forEach(k=>p[k]=f[k].value.trim());const r=await updateGame(g.id,p);if(r.error)alert(r.error.message);else renderGames()}})}
async function renderRequests(){if(!can('manage_requests'))return;const c=document.getElementById('requests-list'),rs=await fetchGameRequests();c.innerHTML=rs.length?rs.map(r=>`<article class="request"><div><b>${esc(r.gamename)}</b><p class="muted">${esc(r.username)} · ${esc(r.email)}</p></div><button data-id="${r.id}" class="action-red">Dismiss & delete</button></article>`).join(''):'<p class="muted">No pending requests.</p>';c.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Dismiss and permanently delete this request?'))return;const r=await deleteGameRequest(b.dataset.id);if(r.error)alert(r.error.message);else renderRequests()})}
async function renderReports(){if(!can('manage_reports'))return;const c=document.getElementById('reports-list'),rs=await fetchReports(),p=rs.filter(r=>r.status==='pending');c.innerHTML=p.length?p.map(r=>`<article class="request"><div><b>${esc(r.reported?.username||'Unknown')}${rankBadge(r.reported?.role)}${tagBadge(r.reported?.tag)}</b><p class="muted mt-1">${esc(r.reason)}</p></div><div class="flex gap-3"><button data-status="resolved" data-id="${r.id}" class="action-cyan">Resolve</button><button data-status="dismissed" data-id="${r.id}" class="action-red">Dismiss</button></div></article>`).join(''):'<p class="muted">No pending reports.</p>';c.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const r=await updateReportStatus(b.dataset.id,b.dataset.status);if(r.error)alert(r.error.message);else renderReports()})}
async function renderUsers(){const c=document.getElementById('users-list');if(!c)return;const r=await fetchProfiles();if(r.error){c.innerHTML=`<p class="text-red-400">${esc(r.error.message)}</p>`;return}c.innerHTML=r.data.map(u=>`<div class="request"><div><b>${esc(u.username)} ${rankBadge(u.role)}${tagBadge(u.tag)}</b><p class="muted">${esc(u.role)} · ${Object.entries(u.permissions||{}).filter(([,v])=>v).map(([k])=>k.replaceAll('_',' ')).join(', ')||'No extra permissions'}</p></div></div>`).join('')||'<p class="muted">No profiles found.</p>'}
const add=document.getElementById('add-form');if(add)add.onsubmit=async e=>{e.preventDefault();const f=e.target,m=document.getElementById('add-message'),r=await createGame({title:f.title.value.trim(),slug:f.slug.value.trim(),category:f.category.value.trim(),platform:f.platform.value.trim(),price:f.price.value.trim(),price_breakdown:f.price_breakdown.value.trim(),tagline:f.tagline.value.trim(),description:f.description.value.trim(),image_url:f.image_url.value.trim()});if(r.error)m.textContent=r.error.message;else{m.textContent='Game added.';f.reset();renderGames()}};
const uf=document.getElementById('user-form');if(uf)uf.onsubmit=async e=>{e.preventDefault();const f=e.target,m=document.getElementById('user-message'),permissions={manage_games:f.manage_games.checked,manage_requests:f.manage_requests.checked,manage_reports:f.manage_reports.checked,manage_users:f.manage_users.checked},tag=f.custom_tag.value.trim()||f.tag.value,r=await createManagedUser({username:f.username.value.trim(),email:f.email.value.trim(),password:f.password.value,tag,role:f.role.value,permissions});if(r.error)m.textContent=r.error.message;else{m.textContent=`Created ${r.data.user.username} with tag ${r.data.user.tag}.`;f.reset();renderUsers()}};
await Promise.all([renderGames(),renderRequests(),renderReports(),renderUsers()]);}}
</script><style>.panel{margin:0 0 2.5rem;padding:2rem;border:1px solid rgba(255,255,255,.1);border-radius:1.5rem;background:rgba(10,10,10,.9)}.panel h2{font-size:1.5rem;font-weight:900;margin-bottom:.5rem}.muted{color:#71717a;font-size:.875rem}.field{width:100%;padding:.85rem 1rem;border-radius:.9rem;background:#050505;border:1px solid rgba(255,255,255,.1);color:#fff;outline:0}.field:focus{border-color:#22d3ee}.game-row{padding:1.25rem;border:1px solid rgba(255,255,255,.1);border-radius:1.25rem;background:rgba(255,255,255,.03)}.request{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem;border:1px solid rgba(255,255,255,.08);border-radius:1rem;background:rgba(255,255,255,.025)}.action-cyan{color:#22d3ee;font-weight:800}.action-purple{color:#c084fc;font-weight:800}.action-red{color:#f87171;font-weight:800}.tag{font-size:.7rem;font-weight:900;color:#facc15;border:1px solid rgba(250,204,21,.3);padding:.35rem .6rem;border-radius:.7rem}.check{display:flex;gap:.7rem;align-items:center;padding:.9rem 1rem;border:1px solid rgba(255,255,255,.08);border-radius:.9rem;background:#050505;color:#d4d4d8}.builder{margin-top:1.25rem;border:1px solid rgba(34,211,238,.2);border-radius:1.25rem;overflow:hidden;background:#070707}.builder-toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid rgba(255,255,255,.08)}.primary{background:#22d3ee;color:#001014;font-weight:900;padding:.7rem 1rem;border-radius:.8rem}.secondary{border:1px solid rgba(255,255,255,.1);padding:.7rem 1rem;border-radius:.8rem}.preset{padding:.5rem .8rem;border:1px solid rgba(255,255,255,.1);border-radius:.7rem;text-transform:capitalize;color:#a1a1aa}.preset.selected{border-color:#22d3ee;color:#22d3ee;background:rgba(34,211,238,.08)}.layout-row{display:flex;align-items:center;gap:.75rem;padding:.75rem;border:1px solid rgba(255,255,255,.08);border-radius:.8rem;background:rgba(255,255,255,.03);cursor:grab}.drag{color:#71717a}.visibility{color:#22d3ee}.visibility.off{color:#f87171}.preview{border:1px solid;border-radius:1.25rem;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;min-height:300px}.preview-label{font-size:.7rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.preview section h3{font-size:1.15rem;font-weight:900;margin-bottom:.35rem}.preview section p{opacity:.72;white-space:pre-line;line-height:1.6}.chip{padding:.5rem .75rem;border-radius:.7rem;font-size:.8rem}</style></body></html>
