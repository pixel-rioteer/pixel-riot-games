<!--
  PIXEL-RIOT — Confirm Signup email template
  Paste this into: Supabase Dashboard → Authentication → Emails → Templates → "Confirm signup"
  (Supabase's {{ .ConfirmationURL }} variable is used below — leave it exactly as-is.)
-->
<div style="background:#0a0a0a;padding:40px 20px;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#111;border:1px solid rgba(255,255,255,0.1);border-radius:24px;overflow:hidden;">
    <tr>
      <td style="padding:36px 32px 24px;text-align:center;background:linear-gradient(135deg, rgba(6,182,212,0.15), rgba(168,85,247,0.15));">
        <div style="font-size:28px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;background-clip:text;color:#22d3ee;">
          PIXEL-RIOT
        </div>
      </td>
    </tr>
    <tr>
      <td style="padding:32px;text-align:center;">
        <h1 style="color:#ffffff;font-size:22px;margin:0 0 12px;">Confirm your email</h1>
        <p style="color:#9ca3af;font-size:15px;line-height:1.6;margin:0 0 28px;">
          Welcome to PIXEL-RIOT! Tap the button below to confirm your email address and activate your account.
        </p>
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;padding:14px 36px;background:#22d3ee;color:#000000;font-weight:800;font-size:15px;text-decoration:none;border-radius:16px;">
          Confirm Email
        </a>
        <p style="color:#6b7280;font-size:13px;margin:28px 0 0;">
          If you didn't create this account, you can safely ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px;border-top:1px solid rgba(255,255,255,0.08);text-align:center;">
        <p style="color:#4b5563;font-size:12px;margin:0;">PIXEL-RIOT · pixel-riot.co.uk</p>
      </td>
    </tr>
  </table>
</div>
