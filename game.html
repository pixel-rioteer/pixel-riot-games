<!DOCTYPE html><html lang="en"><head><script type="module" src="/assets/pixel-riot-lock.js?v=20260917-4"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title id="page-title">Game | PIXEL-RIOT</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body class="min-h-screen bg-black text-white font-sans"><nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10"><div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"><a href="/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a><div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div></div></nav><main class="max-w-5xl mx-auto px-6 py-16" id="game-main"><p class="text-gray-400">Loading game...</p></main><footer class="border-t border-white/10 bg-black py-10 mt-20"><div class="max-w-7xl mx-auto px-6"><div class="text-3xl font-black text-cyan-400">PIXEL-RIOT</div><p class="text-gray-500 mt-2">The ultimate gaming review and guide platform.</p></div></footer><script type="module">import{fetchGameBySlug,fetchReviews,upsertReview,getSession,getProfile,fetchFavoriteGameIds,addFavorite,removeFavorite,escapeHtml,starString,rankBadge,fileReport}from"/assets/pixel-riot-app.js?v=20260917-4";

function box(x){const s=styleOf(x);return`${s.background?`background:${s.background};`:''}${s.textColor?`color:${s.textColor};`:''}${s.borderColor?`border:1px solid ${s.borderColor};`:''}border-radius:${clamp(s.radius,0,40,0)}px;padding:${clamp(s.padding,0,64,0)}px;${s.shadow?'box-shadow:0 20px 50px rgba(0,0,0,.28);':''}`}

function customElement(x,t){const p=x.props||{};switch(x.type){case'heading':return wrap(x,`<h2 class="text-3xl font-black">${escapeHtml(p.text||'Heading')}</h2>`);case'text':return wrap(x,`<p class="leading-relaxed whitespace-pre-line">${escapeHtml(p.text||'Text')}</p>`);case'table':return tableElement(x,t);case'callout':case'notice':return wrap(x,`<h3 class="font-black text-xl">${escapeHtml(p.title||'Notice')}</h3><p class="mt-2 whitespace-pre-line">${escapeHtml(p.text||'')}</p>`);case'list':return wrap(x,`<ul class="list-disc pl-6 space-y-2">${String(p.items||'').split('\n').filter(Boolean).map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul>`);case'divider':return`<hr style="${box(x)}border-color:${x.style?.borderColor||t.accent};margin:16px 0">`;case'image':return p.url?wrap(x,`<img src="${escapeHtml(p.url)}" alt="${escapeHtml(p.alt||'')}" style="width:${clamp(p.width,10,100,100)}%;max-height:${clamp(p.maxHeight,100,1600,1600)}px;object-fit:${['contain','cover','fill'].includes(p.fit)?p.fit:'contain'};display:block;margin:${p.align==='left'?'0 auto 0 0':p.align==='right'?'0 0 0 auto':'0 auto'}" loading="lazy">`):'';case'button':return wrap(x,`<a href="${escapeHtml(p.url||'/')}" ${p.target==='new'?'target="_blank" rel="noopener noreferrer"':''} class="inline-block px-5 py-3 font-black" style="background:${x.style?.background||t.accent};color:${x.style?.textColor||'#000'}">${escapeHtml(p.text||'Button')}</a>`);case'link':return wrap(x,`<a href="${escapeHtml(p.url||'/')}" ${p.target==='new'?'target="_blank" rel="noopener noreferrer"':''} class="font-bold underline" style="color:${x.style?.textColor||t.accent}">${escapeHtml(p.text||'Open page')} ↗</a>`);case'video':return p.url?wrap(x,`<div class="overflow-hidden"><iframe src="${escapeHtml(p.url)}" title="${escapeHtml(p.title||'Video')}" class="w-full aspect-video" loading="lazy" allowfullscreen></iframe></div>`):'';case'quote':return wrap(x,`<blockquote class="border-l-4 pl-5 py-2 italic text-lg" style="border-color if(!slug)main.innerHTML='<p class="text-gray-400">No game specified.</p>';else{const game=await fetchGameBySlug(slug);if(!game)main.innerHTML='<p class="text-gray-400">Game not found.</p>';else{document.title=`${game.title} | PIXEL-RIOT`;const session=await getSession(),profile=session?await getProfile():null,liked=session?(await fetchFavoriteGameIds(session.user.id)).includes(game.id):false;const t={...DEFAULT,...(game.page_theme||{})};document.body.style.background=t.backgroundStyle==='none'?'transparent':t.backgroundStyle==='gradient'?`radial-gradient(circle at 15% 0%,${t.accent}22,transparent 34%),linear-gradient(135deg,${t.background||'#000'},${t.surface||'#000'})`:t.background||'transparent';document.body.style.color=t.text||'#fff';main.style.maxWidth=clamp(t.maxWidth,640,1400,1024)+'px';main.style.color=t.text||'#fff';const layout=Array.isArray(game.page_layout)&&game.page_layout.length?game.page_layout:[{type:'hero',visible:true},{type:'image',visible:true},{type:'description',visible:true},{type:'info',visible:true},{type:'price',visible:true},{type:'tips',visible:true},{type:'known_issues',visible:true},{type:'secrets_cheats',visible:true},{type:'commands_reference',visible:true},{type:'elements_reference',visible:true},{type:'reviews',visible:true}];const gap=clamp(t.sectionGap,8,80,40);const childrenOf=id=>layout.filter(x=>x.parentId===id&&x.visible!==false);const renderNodeBase=x=>{switch(x.type){case'hero':return wrap(x,`<p style="color:${t.accent}" class="uppercase tracking-[0.3em] text-sm font-bold">${escapeHtml(game.category||'')}</p><h1 class="text-6xl font-black mt-4">${escapeHtml(game.title)}</h1><p class="text-xl mt-5 opacity-80">${escapeHtml(game.tagline||'')}</p>`);case'image':return game.image_url?wrap(x,`<img src="${escapeHtml(game.image_url)}" alt="${escapeHtml(game.title)}" style="width:${clamp(x.props?.width,10,100,100)}%;max-height:${clamp(x.props?.maxHeight,100,1600,1600)}px;object-fit:${['contain','cover','fill'].includes(x.props?.fit)?x.props.fit:'contain'};display:block;margin:${x.props?.align==='left'?'0 auto 0 0':x.props?.align==='right'?'0 0 0 auto':'0 auto'}" loading="lazy">`):'';case'description':return wrap(x,`<h2 class="text-3xl font-black mb-3">About ${escapeHtml(game.title)}</h2><p class="leading-relaxed whitespace-pre-line">${escapeHtml(game.description||'')}</p>`);case'info':return wrap(x,`<div class="flex flex-wrap gap-3">${game.platform?`<span class="px-4 py-2 rounded-xl" style="background:${x.style?.background||t.surface||'transparent'}">🖥 ${escapeHtml(game.platform)}</span>`:''}${game.category?`<span class="px-4 py-2 rounded-xl" style="background:${x.style?.background||t.surface||'transparent'}">${escapeHtml(game.category)}</span>`:''}</div>`);case'price':return wrap(x,`<h2 class="text-2xl font-bold">Price</h2><p style="color:${t.accent}" class="text-xl font-black mt-2">${escapeHtml(game.price||'')}</p><p class="text-sm opacity-60 mt-1">${escapeHtml(game.price_breakdown||'')}</p>`);case'tips':return wrap(x,`<h2 class="text-2xl font-bold mb-2">Tips</h2><p class="whitespace-pre-line">${escapeHtml(game.tips||'')}</p>`);case'known_issues':return wrap(x,`<h2 class="text-2xl font-bold mb-2">Known Issues</h2><p class="whitespace-pre-line">${escapeHtml(game.known_issues||'')}</p>`);case'secrets_cheats':return wrap(x,`<h2 class="text-2xl font-bold mb-2">Secrets & Cheats</h2><p class="whitespace-pre-line">${escapeHtml(game.secrets_cheats||'')}</p>`);case'commands_reference':return wrap(x,`<h2 class="text-2xl font-bold mb-2">Commands Reference</h2><p class="whitespace-pre-line">${escapeHtml(game.commands_reference||'')}</p>`);case'elements_reference':return wrap(x,`<h2 class="text-2xl font-bold mb-2">Elements Reference</h2><p class="whitespace-pre-line">${escapeHtml(game.elements_reference||'')}</p>`);case'reviews':return wrap(x,`<h2 class="text-3xl font-black mb-5">Player Reviews</h2><div id="reviews-list" class="space-y-4"></div>`);default:return customElement(x,t)}};const renderNode=x=>{ ument.getElementById('review-form').onsubmit=async e=>{e.preventDefault();const f=e.target,r=await upsertReview({gameId:game.id,userId:session.user.id,rating:Number(f.rating.value),body:f.body.value.trim()});document.getElementById('review-message').textContent=r.error?r.error.message:'Review saved!';renderReviews()}}else formSlot.innerHTML='<p class="opacity-70"><a class="underline" style="color:'+t.accent+'" href="/login.html">Log in</a> to leave a review.</p>';async function renderReviews(){const list=document.getElementById('reviews-list');if(!list)return;const rs=await fetchReviews(game.id);list.innerHTML=rs.length?rs.map(r=>`<article class="rounded-2xl border border-white/10 p-5"><div class="flex justify-between"><strong>${escapeHtml(r.profiles?.username||'Player')}${rankBadge(r.profiles?.role)}</strong><span style="color:${t.accent}">${starString(r.rating)}</span></div><p class="mt-3 opacity-80">${escapeHtml(r.body)}</p>${session&&session.user.id!==r.user_id?`<button data-report data-id="${r.id}" data-user="${r.user_id}" class="mt-3 text-xs opacity-50">Report</button>`:''}</article>`).join(''):'<p class="opacity-60">No reviews yet.</p>';list.querySelectorAll('[data-report]').forEach(b=>b.onclick=async()=>{const reason=prompt('Why are you reporting this review?');if(!reason)return;await fileReport({reporterId:session.user.id,reportedUserId:b.dataset.user,reviewId:b.dataset.id,reason:reason.trim()});b.textContent='Reported';b.disabled=true})}await renderReviews()}}</script></body></html>
