<!DOCTYPE html><html lang="en"><head><script type="module" src="/assets/pixel-riot-lock.js?v=20260917-3"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title id="page-title">Game | PIXEL-RIOT</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css"></head><body class="min-h-screen bg-black text-white font-sans"><nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10"><div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"><a href="/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a><div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div></div></nav><main class="max-w-5xl mx-auto px-6 py-16" id="game-main"><p class="text-gray-400">Loading game...</p></main><footer class="border-t border-white/10 bg-black py-10 mt-20"><div class="max-w-7xl mx-auto px-6"><div class="text-3xl font-black text-cyan-400">PIXEL-RIOT</div><p class="text-gray-500 mt-2">The ultimate gaming review and guide platform.</p></div></footer><script type="module">import{fetchGameBySlug,fetchReviews,upsertReview,getSession,getProfile,fetchFavoriteGameIds,addFavorite,removeFavorite,escapeHtml,starString,rankBadge,fileReport}from"/assets/pixel-riot-app.js";const slug=new URLSearchParams(location.search).get('slug'),main=document.getElementById('game-main');const presets={neon:{accent:'#22d3ee',background:'#050505',surface:'#0a0a0a',text:'#f4f4f5'},purple:{accent:'#a855f7',background:'#08050d',surface:'#120b1d',text:'#faf5ff'},fire:{accent:'#fb923c',background:'#0b0502',surface:'#1a0c05',text:'#fff7ed'},ice:{accent:'#60a5fa',background:'#031018',surface:'#071a25',text:'#eff6ff'},lime:{accent:'#a3e635',background:'#071007',surface:'#0d1a0d',text:'#f7fee7'}};function tableElement(x,theme){const p=x.props||{},cols=Array.isArray(p.columns)&&p.columns.length?p.columns:['Column 1','Column 2'],rows=Array.isArray(p.rows)&&p.rows.length?p.rows:[['Value 1','Value 2']];return `<section><div class="overflow-x-auto rounded-2xl border" style="border-color:${theme.accent}55"><table class="w-full text-left border-collapse"><thead><tr>${cols.map(c=>`<th class="p-4 font-black" style="background:${theme.surface}">${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="border-t border-white/10">${cols.map((_,i)=>`<td class="p-4 align-top">${escapeHtml(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${p.caption?`<p class="text-sm opacity-60 mt-2">${escapeHtml(p.caption)}</p>`:''}</section>`}function customElement(x,theme){const p=x.props||{};switch(x.type){case'heading':return`<section><h2 class="text-3xl font-black">${escapeHtml(p.text||'')}</h2></section>`;case'text':return`<section><p class="leading-relaxed opacity-80 whitespace-pre-line">${escapeHtml(p.text||'')}</p></section>`;case'table':return tableElement(x,theme);case'callout':return`<section><div class="rounded-2xl border p-5" style="border-color:${theme.accent};background:${theme.surface}"><h3 class="font-black text-xl">${escapeHtml(p.title||'Callout')}</h3><p class="mt-2 opacity-80 whitespace-pre-line">${escapeHtml(p.text||'')}</p></div></section>`;case'list':return`<section><ul class="list-disc pl-6 space-y-2 opacity-80">${String(p.items||'').split('\n').filter(Boolean).map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul></section>`;case'divider':return`<hr style="border-color:${theme.accent}55">`;case'image':return p.url?`<section><div class="rounded-3xl border overflow-hidden bg-black/20" style="border-color:${theme.accent}55"><img src="${escapeHtml(p.url)}" alt="" class="block w-full h-auto object-contain"></div></section>`:'';case'button':return`<section><a href="${escapeHtml(p.url||'/')}" ${p.target==='new'?'target="_blank" rel="noopener noreferrer"':''} class="inline-block px-5 py-3 rounded-2xl font-black" style="background:${theme.accent};color:${theme.background}">${escapeHtml(p.text||'Button')}</a></section>`;case'link':return`<section><a href="${escapeHtml(p.url||'/')}" ${p.target==='new'?'target="_blank" rel="noopener noreferrer"':''} class="font-bold underline" style="color:${theme.accent}">${escapeHtml(p.text||'Open page')} ↗</a></section>`;case'video':return p.url?`<section><div class="rounded-3xl overflow-hidden border" style="border-color:${theme.accent}55"><iframe src="${escapeHtml(p.url)}" title="${escapeHtml(p.title||'Video')}" class="w-full aspect-video" loading="lazy" allowfullscreen></iframe></div></section>`:'';case'quote':return`<section><blockquote class="border-l-4 pl-5 py-2 italic text-lg" style="border-color:${theme.accent}">“${escapeHtml(p.text||'')}”${p.author?`<footer class="mt-2 text-sm not-italic opacity-60">— ${escapeHtml(p.author)}</footer>`:''}</blockquote></section>`;case'code':return`<section><pre class="p-5 rounded-2xl overflow-auto" style="background:${theme.surface}"><code>${escapeHtml(p.text||'')}</code></pre></section>`;case'notice':return`<section><div class="rounded-2xl border p-5" style="border-color:${theme.accent};background:${theme.surface}"><h3 class="font-black">${escapeHtml(p.title||'Notice')}</h3><p class="mt-2 whitespace-pre-line opacity-80">${escapeHtml(p.text||'')}</p></div></section>`;case'spacer':return`<div style="height:${Math.max(8,Math.min(240,Number(p.height)||32))}px"></div>`;case'accordion':return`<section><details class="rounded-2xl border p-4" style="border-color:${theme.accent}55"><summary class="font-black cursor-pointer">${escapeHtml(p.title||'More information')}</summary><p class="mt-3 whitespace-pre-line opacity-80">${escapeHtml(p.text||'')}</p></details></section>`;default:return''}}if(!slug)main.innerHTML='<p class="text-gray-400">No game specified.</p>';else{const game=await fetchGameBySlug(slug);if(!game)main.innerHTML='<p class="text-gray-400">Game not found.</p>';else{document.title=`${game.title} | PIXEL-RIOT`;const session=await getSession(),profile=session?await getProfile():null,liked=session?(await fetchFavoriteGameIds(session.user.id)).includes(game.id):false;const theme=game.page_theme||presets.neon,layout=Array.isArray(game.page_layout)&&game.page_layout.length?game.page_layout:[{type:'hero',visible:true},{type:'image',visible:true},{type:'description',visible:true},{type:'info',visible:true},{type:'price',visible:true},{type:'tips',visible:true},{type:'known_issues',visible:true},{type:'secrets_cheats',visible:true},{type:'commands_reference',visible:true},{type:'elements_reference',visible:true},{type:'reviews',visible:true}];document.body.style.background=theme.background;document.body.style.color=theme.text;main.innerHTML=`<div class="space-y-10">${layout.filter(x=>x.visible!==false).map(x=>{switch(x.type){case'hero':return`<section><p style="color:${theme.accent}" class="uppercase tracking-[0.3em] text-sm font-bold">${escapeHtml(game.category||'')}</p><h1 class="text-6xl font-black mt-4">${escapeHtml(game.title)}</h1><p class="text-xl mt-5 opacity-80">${escapeHtml(game.tagline||'')}</p></section>`;case'image':return game.image_url?`<div class="rounded-3xl border overflow-hidden bg-black/20" style="border-color:${theme.accent}55"><img src="${escapeHtml(game.image_url)}" alt="${escapeHtml(game.title)}" class="block w-full h-auto object-contain"></div>`:'';case'description':return`<section><h2 class="text-3xl font-black mb-3">About ${escapeHtml(game.title)}</h2><p class="leading-relaxed opacity-80 whitespace-pre-line">${escapeHtml(game.description||'')}</p></section>`;case'info':return`<div class="flex flex-wrap gap-3">${game.platform?`<span class="px-4 py-2 rounded-xl" style="background:${theme.surface}">🖥 ${escapeHtml(game.platform)}</span>`:''}${game.category?`<span class="px-4 py-2 rounded-xl" style="background:${theme.surface}">${escapeHtml(game.category)}</span>`:''}</div>`;case'price':return`<section><h2 class="text-2xl font-bold">Price</h2><p style="color:${theme.accent}" class="text-xl font-black mt-2">${escapeHtml(game.price||'')}</p><p class="text-sm opacity-60 mt-1">${escapeHtml(game.price_breakdown||'')}</p></section>`;case'tips':return`<section><h2 class="text-2xl font-bold mb-2">Tips</h2><p class="opacity-80 whitespace-pre-line">${escapeHtml(game.tips||'')}</p></section>`;case'known_issues':return`<section><h2 class="text-2xl font-bold mb-2">Known Issues</h2><p class="opacity-80 whitespace-pre-line">${escapeHtml(game.known_issues||'')}</p></section>`;case'secrets_cheats':return`<section><h2 class="text-2xl font-bold mb-2">Secrets & Cheats</h2><p class="opacity-80 whitespace-pre-line">${escapeHtml(game.secrets_cheats||'')}</p></section>`;case'commands_reference':return`<section><h2 class="text-2xl font-bold mb-2">Commands Reference</h2><p class="opacity-80 whitespace-pre-line">${escapeHtml(game.commands_reference||'')}</p></section>`;case'elements_reference':return`<section><h2 class="text-2xl font-bold mb-2">Elements Reference</h2><p class="opacity-80 whitespace-pre-line">${escapeHtml(game.elements_reference||'')}</p></section>`;case'reviews':return`<section><h2 class="text-3xl font-black mb-5">Player Reviews</h2><div id="reviews-list" class="space-y-4"></div></section>`;default:return customElement(x,theme)}}).join('')}<button id="fav-btn" class="px-6 py-3 rounded-2xl font-bold border" style="border-color:${theme.accent};color:${theme.accent}">${liked?'★ Favorited':'☆ Add to Favorites'}</button><section><h2 class="text-3xl font-black mb-5">Leave a Review</h2><div id="review-form-slot"></div></section></div>`;let favorited=liked;document.getElementById('fav-btn').onclick=async()=>{if(!session){location.href=`/login.html?next=${encodeURIComponent(location.pathname+location.search)}`;return}if(favorited){await removeFavorite(session.user.id,game.id);favorited=false}else{await addFavorite(session.user.id,game.id);favorited=true}document.getElementById('fav-btn').textContent=favorited?'★ Favorited':'☆ Add to Favorites'};const formSlot=document.getElementById('review-form-slot');if(session&&profile?.banned)formSlot.innerHTML='<p class="text-red-400">Your account is banned from posting reviews.</p>';else if(session){formSlot.innerHTML=`<form id="review-form" class="space-y-4"><div class="grid grid-cols-5 gap-2">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="rating" value="${n}" class="peer sr-only"><span class="block rounded-xl border border-white/10 px-2 py-3 text-center peer-checked:border-cyan-400">${n} ★</span></label>`).join('')}</div><textarea name="body" rows="4" required class="w-full p-4 rounded-2xl bg-black/40 border border-white/10" placeholder="What do you think?"></textarea><button class="w-full py-4 rounded-2xl font-black" style="background:${theme.accent};color:${theme.background}">Submit Review</button><p id="review-message" class="text-sm opacity-70"></p></form>`;document.getElementById('review-form').onsubmit=async e=>{e.preventDefault();const f=e.target,r=await upsertReview({gameId:game.id,userId:session.user.id,rating:Number(f.rating.value),body:f.body.value.trim()});document.getElementById('review-message').textContent=r.error?r.error.message:'Review saved!';renderReviews()}}else formSlot.innerHTML='<p class="opacity-70"><a class="underline" style="color:'+theme.accent+'" href="/login.html">Log in</a> to leave a review.</p>';async function renderReviews(){const list=document.getElementById('reviews-list');if(!list)return;const rs=await fetchReviews(game.id);list.innerHTML=rs.length?rs.map(r=>`<article class="rounded-2xl border border-white/10 p-5"><div class="flex justify-between"><strong>${escapeHtml(r.profiles?.username||'Player')}${rankBadge(r.profiles?.role)}</strong><span style="color:${theme.accent}">${starString(r.rating)}</span></div><p class="mt-3 opacity-80">${escapeHtml(r.body)}</p>${session&&session.user.id!==r.user_id?`<button data-report data-id="${r.id}" data-user="${r.user_id}" class="mt-3 text-xs opacity-50">Report</button>`:''}</article>`).join(''):'<p class="opacity-60">No reviews yet.</p>';list.querySelectorAll('[data-report]').forEach(b=>b.onclick=async()=>{const reason=prompt('Why are you reporting this review?');if(!reason)return;await fileReport({reporterId:session.user.id,reportedUserId:b.dataset.user,reviewId:b.dataset.id,reason:reason.trim()});b.textContent='Reported';b.disabled=true})}await renderReviews()}}</script></body></html>
