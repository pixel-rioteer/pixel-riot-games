<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Game | PIXEL-RIOT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-black text-white font-sans overflow-x-hidden">
  <nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/home/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a>
      <div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-6 py-16" id="game-main">
    <p class="text-gray-400">Loading game...</p>
  </main>

  <footer class="border-t border-white/10 bg-black py-10 mt-20">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
      <div>
        <div class="text-3xl font-black text-cyan-400">PIXEL-RIOT</div>
        <p class="text-gray-500 mt-2">The ultimate gaming review and guide platform.</p>
      </div>
      <div class="flex flex-wrap justify-center gap-6 text-gray-400 text-sm">
        <a href="/games/">All Games</a>
        <a href="/leaderboard.html">Leaderboard</a>
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
        <a href="/contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import {
      fetchGameBySlug, fetchReviews, upsertReview, getSession, getProfile,
      fetchFavoriteGameIds, addFavorite, removeFavorite, escapeHtml, starString,
    } from "/assets/pixel-riot-app.js";

    const slug = new URLSearchParams(window.location.search).get("slug");
    const main = document.getElementById("game-main");

    if (!slug) {
      main.innerHTML = '<p class="text-gray-400">No game specified. <a class="text-cyan-400 underline" href="/games/">Browse all games</a>.</p>';
    } else {
      const game = await fetchGameBySlug(slug);
      if (!game) {
        main.innerHTML = '<p class="text-gray-400">Game not found. <a class="text-cyan-400 underline" href="/games/">Browse all games</a>.</p>';
      } else {
        document.getElementById("page-title").textContent = `${game.title} | PIXEL-RIOT`;
        const session = await getSession();
        const profile = session ? await getProfile() : null;
        const isFavorite = session ? (await fetchFavoriteGameIds(session.user.id)).includes(game.id) : false;

        main.innerHTML = `
          <p class="text-cyan-400 uppercase tracking-[0.3em] text-sm font-bold">${escapeHtml(game.category || '')}</p>
          <h1 class="text-6xl font-black mt-4">${escapeHtml(game.title)}</h1>
          <p class="text-gray-300 text-xl mt-5">${escapeHtml(game.tagline || '')}</p>
          <div class="mt-6 h-72 rounded-3xl bg-cover bg-center border border-white/10" style="background-image:url('${escapeHtml(game.image_url || '')}')"></div>
          <p class="mt-6 text-gray-300 leading-relaxed">${escapeHtml(game.description || '')}</p>

          <div class="mt-8 flex flex-wrap gap-4">
            <button id="fav-btn" class="px-6 py-3 rounded-2xl font-bold border ${isFavorite ? 'bg-cyan-500 text-black border-cyan-500' : 'border-white/20 hover:border-cyan-400'}">
              ${isFavorite ? '★ Favorited' : '☆ Add to Favorites'}
            </button>
          </div>

          <section class="mt-16">
            <h2 class="text-3xl font-black mb-6">Leave a Review</h2>
            <div id="review-form-slot"></div>
          </section>

          <section class="mt-16">
            <h2 class="text-3xl font-black mb-6">Player Reviews</h2>
            <div id="reviews-list" class="space-y-4"></div>
          </section>
        `;

        // Favorite toggle
        const favBtn = document.getElementById("fav-btn");
        let favorited = isFavorite;
        favBtn.addEventListener("click", async () => {
          if (!session) {
            window.location.href = `/login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
            return;
          }
          if (favorited) {
            await removeFavorite(session.user.id, game.id);
            favorited = false;
            favBtn.textContent = "☆ Add to Favorites";
            favBtn.className = "px-6 py-3 rounded-2xl font-bold border border-white/20 hover:border-cyan-400";
          } else {
            await addFavorite(session.user.id, game.id);
            favorited = true;
            favBtn.textContent = "★ Favorited";
            favBtn.className = "px-6 py-3 rounded-2xl font-bold border bg-cyan-500 text-black border-cyan-500";
          }
        });

        // Review form
        const formSlot = document.getElementById("review-form-slot");
        if (session) {
          formSlot.innerHTML = `
            <form id="review-form" class="space-y-5 rounded-3xl border border-white/10 bg-zinc-950 p-8">
              <fieldset>
                <legend class="px-2 text-sm font-bold uppercase tracking-widest text-cyan-400">Rating</legend>
                <div class="mt-3 grid grid-cols-5 gap-2">
                  ${[1,2,3,4,5].map((n) => `
                    <label class="cursor-pointer">
                      <input type="radio" name="rating" value="${n}" class="peer sr-only" ${n === 5 ? '' : ''} />
                      <span class="block rounded-xl border border-white/10 bg-black px-2 py-3 text-center text-sm font-black text-gray-300 transition peer-checked:border-cyan-400 peer-checked:bg-cyan-500 peer-checked:text-black">${n} ★</span>
                    </label>
                  `).join('')}
                </div>
              </fieldset>
              <textarea name="body" rows="4" minlength="5" required placeholder="What do you think of ${escapeHtml(game.title)}?" class="w-full p-4 rounded-2xl bg-black border border-white/10 outline-none focus:border-cyan-400"></textarea>
              <button type="submit" class="w-full py-4 rounded-2xl bg-cyan-500 text-black font-black hover:bg-cyan-400 transition-all">Submit Review</button>
              <p class="text-sm text-gray-400" id="review-message"></p>
            </form>
          `;
          document.getElementById("review-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const form = e.target;
            const rating = form.rating.value;
            const message = document.getElementById("review-message");
            if (!rating) { message.textContent = "Pick a star rating."; return; }
            const { error } = await upsertReview({
              gameId: game.id, userId: session.user.id, rating: Number(rating), body: form.body.value.trim(),
            });
            if (error) { message.textContent = error.message; return; }
            message.textContent = "Review saved!";
            await renderReviews();
          });
        } else {
          formSlot.innerHTML = `<p class="text-gray-400">
            <a href="/login.html?next=${encodeURIComponent(location.pathname + location.search)}" class="text-cyan-400 hover:underline">Log in</a>
            to leave a review.
          </p>`;
        }

        async function renderReviews() {
          const reviews = await fetchReviews(game.id);
          const list = document.getElementById("reviews-list");
          if (!reviews.length) {
            list.innerHTML = '<p class="text-gray-400">No reviews yet. Be the first!</p>';
            return;
          }
          list.innerHTML = reviews.map((r) => `
            <article class="rounded-2xl border border-white/10 bg-black/40 p-5">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <strong class="text-cyan-300">${escapeHtml(r.profiles?.username || 'Player')}</strong>
                <span class="text-cyan-300 font-black">${starString(r.rating)}</span>
              </div>
              <p class="mt-3 text-gray-300 leading-relaxed">${escapeHtml(r.body)}</p>
            </article>
          `).join('');
        }
        await renderReviews();
      }
    }
  </script>
</body>
</html>
