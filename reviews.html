<!DOCTYPE html>
<html lang="en">
<head><script type="module" src="/assets/pixel-riot-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reviews | PIXEL-RIOT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-black text-white font-sans">
  <nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-6">
      <a href="/home/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a>
      <div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-20">
    <section class="mb-14">
      <p class="text-cyan-400 uppercase tracking-[0.3em] text-sm font-bold">Game Reviews</p>
      <h1 class="text-6xl font-black mt-4">Reviews</h1>
      <p class="text-gray-300 text-xl mt-5 max-w-3xl">Pick a game below to read what other players think, or sign in to leave your own rating and review.</p>
    </section>

    <section id="game-review-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <p class="text-gray-400">Loading games...</p>
    </section>
  </main>

  <footer class="border-t border-white/10 bg-black py-10 mt-20">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
      <div>
        <div class="text-3xl font-black text-cyan-400">PIXEL-RIOT</div>
        <p class="text-gray-500 mt-2">The ultimate gaming review and guide platform.</p>
      </div>
      <div class="flex flex-wrap justify-center gap-6 text-gray-400 text-sm">
        <a href="/games/">All Games</a>
        <a href="/leaderboard.html">Leaderboard</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { fetchGames, fetchLeaderboard, escapeHtml, starString } from "/assets/pixel-riot-app.js";

    const [games, leaderboard] = await Promise.all([fetchGames(), fetchLeaderboard()]);
    const ratingsBySlug = Object.fromEntries(leaderboard.map((row) => [row.slug, row]));
    const grid = document.getElementById("game-review-grid");

    if (!games.length) {
      grid.innerHTML = '<p class="text-gray-400">No games yet — check back soon.</p>';
    } else {
      grid.innerHTML = games.map((g) => {
        const rating = ratingsBySlug[g.slug];
        const ratingLine = rating && rating.review_count > 0
          ? `${starString(rating.avg_rating)} <span class="text-gray-500 text-sm">(${rating.review_count})</span>`
          : '<span class="text-gray-500 text-sm">No reviews yet</span>';
        return `
          <article class="rounded-3xl overflow-hidden border border-white/10 bg-white/5 hover:bg-white/10 transition-all hover:scale-[1.02] p-6">
            <h3 class="text-2xl font-bold">${escapeHtml(g.title)}</h3>
            <p class="text-gray-400 mt-2">${escapeHtml(g.category || '')}</p>
            <div class="mt-4 text-cyan-300 font-black">${ratingLine}</div>
            <a href="/game.html?slug=${encodeURIComponent(g.slug)}" class="mt-6 block text-center w-full py-3 rounded-2xl bg-purple-600 hover:bg-purple-500 transition-all font-bold">Read &amp; Write Reviews</a>
          </article>
        `;
      }).join('');
    }
  </script>
</body>
</html>
