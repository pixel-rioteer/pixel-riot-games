<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Account | PIXEL-RIOT</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css" /></head>
<body class="min-h-screen bg-black text-white font-sans">
  <nav class="sticky top-0 z-50 bg-black/80 border-b border-white/10"><div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"><a href="index.html" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a><div class="hidden md:flex gap-8 text-sm font-semibold text-gray-300"><a href="reviews.html" class="hover:text-cyan-400">Reviews</a><a href="guides.html" class="hover:text-cyan-400">Guides</a><a href="minecraft.html" class="hover:text-cyan-400">Minecraft</a><a href="esports.html" class="hover:text-cyan-400">Esports</a><a href="xynex.html" class="hover:text-cyan-400">Xynex</a></div></div></nav>
  <main class="max-w-4xl mx-auto px-6 py-20">
    <p class="text-cyan-400 uppercase tracking-[0.3em] text-sm font-bold">Player Account</p>
    <h1 class="text-6xl font-black mt-4">Create Your Username</h1>
    <p class="text-gray-300 text-xl mt-5">Choose the username that will be used when you leave reviews on this device.</p>
    <section class="mt-10 rounded-3xl border border-white/10 bg-zinc-950 p-8">
      <div class="mb-6 rounded-2xl border border-cyan-500/30 bg-cyan-500/10 p-4 text-cyan-200" data-account-name>No account yet</div>
      <form data-account-form class="space-y-5">
        <input name="username" minlength="3" placeholder="Username" class="w-full rounded-2xl bg-black border border-white/10 p-4 outline-none focus:border-cyan-400" />
        <button class="w-full rounded-2xl bg-cyan-500 text-black font-black py-4" type="submit">Save Username</button>
        <p class="text-sm text-gray-400" data-account-message>Your username is saved in this browser.</p>
      </form>
    </section>
  </main>
  <script src="pixel-riot.js"></script>
</body>
</html>
