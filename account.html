<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account | PIXEL-RIOT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-black text-white font-sans overflow-x-hidden">
  <nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="home/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a>
      <div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-6 py-20">
    <p class="text-cyan-400 uppercase tracking-[0.3em] text-sm font-bold">Player Account</p>
    <h1 class="text-6xl font-black mt-4" id="account-heading">Your Account</h1>

    <section class="mt-10 rounded-3xl border border-white/10 bg-zinc-950 p-8">
      <div id="account-info" class="text-gray-300">Loading...</div>
    </section>

    <section class="mt-12">
      <h2 class="text-3xl font-black">Your Favorites</h2>
      <div id="favorites-list" class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </section>

    <section class="mt-12">
      <h2 class="text-3xl font-black">Your Reviews</h2>
      <div id="reviews-list" class="mt-6 space-y-4"></div>
    </section>
  </main>

  <script type="module">
    import { requireAuth, getProfile, blockIfBanned, supabase, fetchFavoriteGameIds, escapeHtml, starString, removeFavorite, rankBadge } from "/assets/pixel-riot-app.js?v=20260916-2";

    const session = await requireAuth();
    if (session && !(await blockIfBanned())) {
      const profile = await getProfile();
      document.getElementById("account-heading").textContent = `Welcome, ${profile.username}`;
      document.getElementById("account-info").innerHTML = `
        <div class="rounded-2xl border border-cyan-500/30 bg-cyan-500/10 p-4 text-cyan-200 flex flex-wrap items-center justify-between gap-3">
          <span>Signed in as <strong>${escapeHtml(profile.username)}</strong>${rankBadge(profile.role)} (${escapeHtml(profile.email)})</span>
          <a href="settings.html" class="text-cyan-300 hover:underline text-sm font-semibold">Account Settings →</a>
        </div>
      `;

      const gameIds = await fetchFavoriteGameIds(session.user.id);
      const favContainer = document.getElementById("favorites-list");
      if (!gameIds.length) {
        favContainer.innerHTML = '<p class="text-gray-400">No favorites yet. Go add some from the games page!</p>';
      } else {
        const { data: games } = await supabase.from("games").select("*").in("id", gameIds);
        favContainer.innerHTML = games.map((g) => `
          <article class="rounded-2xl border border-white/10 bg-white/5 p-5">
            <h3 class="text-xl font-bold">${escapeHtml(g.title)}</h3>
            <p class="text-gray-400 text-sm mt-1">${escapeHtml(g.category || '')}</p>
            <div class="mt-4 flex gap-3">
              <a href="game.html?slug=${encodeURIComponent(g.slug)}" class="text-cyan-400 hover:underline text-sm font-semibold">View page</a>
              <button data-remove-fav="${g.id}" class="text-red-400 hover:underline text-sm font-semibold">Remove</button>
            </div>
          </article>
        `).join('');

        favContainer.querySelectorAll('[data-remove-fav]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            await removeFavorite(session.user.id, btn.dataset.removeFav);
            btn.closest('article').remove();
          });
        });
      }

      const { data: reviews } = await supabase
        .from("reviews")
        .select("id, rating, body, created_at, games(title, slug)")
        .eq("user_id", session.user.id)
        .order("created_at", { ascending: false });

      const reviewsContainer = document.getElementById("reviews-list");
      if (!reviews || !reviews.length) {
        reviewsContainer.innerHTML = '<p class="text-gray-400">You haven\'t written any reviews yet.</p>';
      } else {
        reviewsContainer.innerHTML = reviews.map((r) => `
          <article class="rounded-2xl border border-white/10 bg-black/40 p-5">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <a href="game.html?slug=${encodeURIComponent(r.games.slug)}" class="text-cyan-300 font-bold hover:underline">${escapeHtml(r.games.title)}</a>
              <span class="text-cyan-300 font-black">${starString(r.rating)}</span>
            </div>
            <p class="mt-3 text-gray-300 leading-relaxed">${escapeHtml(r.body)}</p>
          </article>
        `).join('');
      }
    }
  </script>
</body>
</html>
