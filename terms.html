<!DOCTYPE html>
<html>
<head>
  <title>Copy Text Example</title>
</head>
<body>

<div id="myTextbox" value="minecraft"><p>Minecraft</p><button onclick="copyText()">Copy</button>
</div>
<script>
function copyText() {
  const textbox = document.getElementById("myTextbox");

  navigator.clipboard.writeText(textbox.value)
    .then(() => {
      alert("Copied!");
    })
    .catch(err => {
      console.error("Failed to copy: ", err);
    });
}
</script>

</body>
</html>
