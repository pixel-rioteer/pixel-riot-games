<!DOCTYPE html>
<html>
<head>
  <title>Copy Text Example</title>
</head>
<body>

<p id="copySource">Locked text that users cannot change.<button id="copyBtn"></button></p>

<script>
const btn = document.getElementById("copyBtn");
let original = btn.innerText = "Copy text";

btn.addEventListener("click", () => {
    let text = document.getElementById("copySource").innerText;
    text.textContent = text.textContent.replace("Copy text", "");

    navigator.clipboard.writeText(text).then(() => {
        btn.innerText = "Copied!";
        btn.disabled = true;

        setTimeout(() => {
            btn.innerText = original;
            btn.disabled = false;
        }, 3000);
    });
});
</script>

</body>
</html>
