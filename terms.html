<!DOCTYPE html>
<html>
<head>
  <title>Copy Text Example</title>
</head>
<body>

<div id="myTextbox" value="minecraft"><p>Minecraft</p><button onclick="copyText()">Copy</button>
</div>
<script>
function copyText() {
  const textbox = document.getElementById("myTextbox");

  navigator.clipboard.writeText(textbox.value)
    .then(() => {
      alert("Copied!");
    })
    .catch(err => {
      console.error("Failed to copy: ", err);
    });
}
</script>


<p id="copySource" style="display:none;">Locked text that users cannot change.</p>

<button id="copyBtn">Copy Text</button>

<script>
const btn = document.getElementById("copyBtn");
const original = btn.innerText;

btn.addEventListener("click", () => {
    const text = document.getElementById("copySource").innerText;

    navigator.clipboard.writeText(text).then(() => {
        btn.innerText = "Copied!";
        btn.disabled = true;

        setTimeout(() => {
            btn.innerText = original;
            btn.disabled = false;
        }, 3000);
    });
});
</script>

</body>
</html>
