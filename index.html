<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://kit.fontawesome.com/64dd7935db.js" crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIXEL-RIOT Gaming Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JT9HZRRK9J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-JT9HZRRK9J');
  </script>
</head>
<body class="min-h-screen bg-black text-white font-sans overflow-x-hidden">
  <section class="relative min-h-[85vh] flex items-center justify-center bg-gradient-to-br from-purple-900 via-black to-blue-900">
    <div class="absolute inset-0 opacity-30 bg-[url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1400&auto=format&fit=crop')] bg-cover bg-center">
    </div>
    <div class="relative z-10 text-center px-6">
      <h1 class="text-6xl md:text-8xl font-black tracking-tight bg-gradient-to-r from-cyan-400 to-purple-500 text-transparent bg-clip-text">PIXEL-RIOT</h1>
      <div class="mt-10 flex flex-wrap justify-center gap-4">
      </div>
    </div>
  </section>

  <main>
    <h3 class="text-5x1 font-black">Sorry!</h3>
    <p class="text-gray-400 mt-2">Our website has not released yet! follow out tiktok social to follow up on new updates</p>
    <div class="mt-10 flex flex-wrap justify-center gap-4">
        <a href="/about-/" class="px-8 py-4 rounded-2xl bg-cyan-500 hover:bg-cyan-400 transition-all text-black font-bold shadow-2xl shadow-cyan-500/40">About Us</a>
    <section class="max-w-7xl mx-auto px-6 py-24">
      
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
        <form id="reqForm" class="rounded-3xl border border-white/10 bg-white/5 p-8">
        <h3 class="text-3xl font-bold mb-6">Request A Game</h3>
        <legend class="px-2 text-sm font-bold uppercase tracking-widest text-cyan-400">Not Working. Please Contact <u>request-games@pixel-riot.co.uk</u> For requesting games</legend>
        <div class="space-y-5">
        <!--User Name-->
        <input id="username" type="text" placeholder="Username (doesnt matter, choose whatever you want)" class="w-full p-4 rounded-2xl bg-black border border-white/10 outline-none focus:border-cyan-400" />
        <!--Email-->
        <input id="email" type="email" placeholder="Email" class="w-full p-4 rounded-2xl bg-black border border-white/10 outline-none focus:border-cyan-400" />
        <!--Game Name Request-->
        <input id="gamename" type="text" placeholder="Game Name" class="w-full p-4 rounded-2xl bg-black border border-white/10 outline-none focus:border-cyan-400" />
        <!--Submit-->
        <input type="submit" class="w-full p-4 rounded-2xl bg-black border border-white/10 outline-none focus:border-cyan-400"/>
        </div>
      </form>
      </div>
    </section>
  </main>
  
<script type="module">

  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
  const supabase = createClient(
    "https://kklarbwjgyxqhculbluy.supabase.co",
    "sb_publishable_hQILSRKRQCekEr8CDUNXiA_YtxZnYE0"
  );
  document.getElementById("reqForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const username = form.elements["username"].value;
    const gamename = form.elements["gamename"].value;
    const email = form.elements["email"].value;
    // NOTE: table name has a dash, so we quote it in SQL—supabase-js handles it as a string.
    const { data, error } = await supabase
      .from("game-reqs")
      .insert([{ username, email, gamename }])
      .select();
    if (error) {
      console.error("Insert failed:", error);
      alert(error.message);
      return;
    }
    alert("you have requested this game!!! it will be on this soon!");
    console.log(data);
  });
</script>
</body>
</html>
