<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | PIXEL-RIOT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-black text-white font-sans overflow-x-hidden">
  <nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="home/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a>
      <div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-16" id="settings-main">
    <p class="text-gray-400">Loading...</p>
  </main>

  <script type="module">
    import { requireAuth, getProfile, blockIfBanned, supabase, rankBadge, escapeHtml } from "/assets/pixel-riot-app.js";

    const session = await requireAuth();
    if (session) {
      if (await blockIfBanned()) { /* redirected */ }
      else {
        const profile = await getProfile();
        const main = document.getElementById("settings-main");
        main.innerHTML = `
          <p class="text-cyan-400 uppercase tracking-[0.3em] text-sm font-bold">Your Account</p>
          <h1 class="text-5xl font-black mt-4">Settings</h1>
          <p class="mt-4 text-gray-300">Signed in as <strong>${escapeHtml(profile.username)}</strong>${rankBadge(profile.role)}</p>

          <section class="mt-10 rounded-3xl border border-white/10 bg-zinc-950 p-8">
            <h2 class="text-xl font-bold mb-5">Username</h2>
            <form id="username-form" class="flex flex-col sm:flex-row gap-3">
              <input name="username" value="${escapeHtml(profile.username)}" minlength="3" required
                class="flex-1 p-4 rounded-2xl bg-black border border-white/10 outline-none focus:border-cyan-400" />
              <button class="px-6 py-4 rounded-2xl bg-cyan-500 text-black font-bold hover:bg-cyan-400 whitespace-nowrap">Save</button>
            </form>
            <p id="username-message" class="mt-3 text-sm text-gray-400"></p>
          </section>

          <section class="mt-8 rounded-3xl border border-white/10 bg-zinc-950 p-8">
            <h2 class="text-xl font-bold mb-5">Email</h2>
            <p class="text-gray-400 text-sm mb-4">Current: ${escapeHtml(profile.email)}</p>
            <form id="email-form" class="flex flex-col sm:flex-row gap-3">
              <input name="email" type="email" placeholder="New email address" required
                class="flex-1 p-4 rounded-2xl bg-black border border-white/10 outline-none focus:border-cyan-400" />
              <button class="px-6 py-4 rounded-2xl bg-purple-600 hover:bg-purple-500 font-bold whitespace-nowrap">Update</button>
            </form>
            <p id="email-message" class="mt-3 text-sm text-gray-400"></p>
          </section>

          <section class="mt-8 rounded-3xl border border-white/10 bg-zinc-950 p-8">
            <h2 class="text-xl font-bold mb-5">Password</h2>
            <form id="password-form" class="flex flex-col sm:flex-row gap-3">
              <input name="password" type="password" minlength="6" placeholder="New password" required
                class="flex-1 p-4 rounded-2xl bg-black border border-white/10 outline-none focus:border-cyan-400" />
              <button class="px-6 py-4 rounded-2xl bg-purple-600 hover:bg-purple-500 font-bold whitespace-nowrap">Update</button>
            </form>
            <p id="password-message" class="mt-3 text-sm text-gray-400"></p>
          </section>
        `;

        document.getElementById("username-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const message = document.getElementById("username-message");
          const { error } = await supabase
            .from("profiles")
            .update({ username: e.target.username.value.trim() })
            .eq("id", session.user.id);
          message.textContent = error ? error.message : "Username updated!";
        });

        document.getElementById("email-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const message = document.getElementById("email-message");
          const { error } = await supabase.auth.updateUser({ email: e.target.email.value.trim() });
          message.textContent = error ? error.message : "Check both your old and new inbox to confirm the change.";
        });

        document.getElementById("password-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const message = document.getElementById("password-message");
          const { error } = await supabase.auth.updateUser({ password: e.target.password.value });
          message.textContent = error ? error.message : "Password updated!";
          e.target.reset();
        });
      }
    }
  </script>
</body>
</html>
