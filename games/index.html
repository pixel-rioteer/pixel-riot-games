<!DOCTYPE html>
<html lang="en">
<head><script type="module" src="/assets/pixel-riot-lock.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Games | PIXEL-RIOT Gaming Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>

<body class="min-h-screen bg-black text-white font-sans overflow-x-hidden">
  <nav class="sticky top-0 z-50 backdrop-blur-xl bg-black/70 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-6">
      <a href="/home/" class="text-2xl font-black text-cyan-400">PIXEL-RIOT</a>
      <div data-auth-nav-slot class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300"></div>
    </div>
  </nav>

  <main>
    <section id="games-section" class="max-w-7xl mx-auto px-6 py-24">
      <div class="mb-10">
        <h2 class="text-5xl font-black">Games We Offer</h2>
        <p class="text-gray-400 mt-2">Every game here lives in our database. <a href="/index.html#reqForm" class="text-cyan-400 hover:underline">Request a game</a> if you don't see one.</p>
      </div>
      <div id="games-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <p class="text-gray-400">Loading games...</p>
      </div>
    </section>
  </main>

  <footer class="border-t border-white/10 bg-black py-10 mt-20">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
      <div>
        <div class="text-3xl font-black text-cyan-400">PIXEL-RIOT</div>
        <p class="text-gray-500 mt-2">The ultimate gaming review and guide platform.</p>
      </div>
      <div class="flex flex-wrap justify-center gap-6 text-gray-400 text-sm">
        <a href="/leaderboard.html">Leaderboard</a>
        <a href="/privacy.html">Privacy</a>
        <a href="/terms.html">Terms</a>
        <a href="/contact.html">Contact</a>
        <a href="/xynex/">Xynex Partnership</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { fetchGames, escapeHtml } from "/assets/pixel-riot-app.js";

    const games = await fetchGames();
    const grid = document.getElementById("games-grid");

    if (!games.length) {
      grid.innerHTML = '<p class="text-gray-400">No games yet — check back soon.</p>';
    } else {
      grid.innerHTML = games.map((g) => `
        <article class="rounded-3xl overflow-hidden border border-white/10 bg-white/5 hover:bg-white/10 transition-all hover:scale-[1.02]">
          <div class="h-64 bg-cover bg-center" style="background-image: url('${escapeHtml(g.image_url ? (g.image_url.startsWith('http') ? g.image_url : '/' + g.image_url) : '')}')"></div>
          <div class="p-6">
            <h3 class="text-2xl font-bold">${escapeHtml(g.title)}</h3>
            <p class="text-gray-400 mt-2">${escapeHtml(g.category || '')}</p>
            <div class="mt-3 flex flex-wrap gap-2 text-xs">
              ${g.platform ? `<span class="px-3 py-1 rounded-full bg-white/10 text-gray-300">${escapeHtml(g.platform)}</span>` : ''}
              ${g.price ? `<span class="px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 font-bold">${escapeHtml(g.price)}</span>` : ''}
            </div>
            <p class="mt-4 text-gray-300 leading-relaxed">${escapeHtml(g.tagline || '')}</p>
            <a href="/game.html?slug=${encodeURIComponent(g.slug)}" class="mt-6 block text-center w-full py-3 rounded-2xl bg-purple-600 hover:bg-purple-500 transition-all font-bold">Open ${escapeHtml(g.title)} Page</a>
          </div>
        </article>
      `).join('');
    }
  </script>
</body>
</html>
